<!doctype html>
<meta charset="utf-8">
<title>--mo-amp / paused-animation probe</title>

<!--
  Decides §3 of docs/motion-spec.md.

  Four independent legs, so a failure names itself instead of just saying "no":

    1  substitution   var() inside @keyframes resolves at all          (control)
    2  paused-recalc  a PAUSED animation re-resolves when the var changes
    3  ramp           a *transitioned* var drives that re-resolution smoothly
    4  return         easing the var back to 0 returns the frozen pose to neutral

  Leg 2 is the architectural one. Legs 3 and 4 are what make the pause invisible.
  Open in each target browser. Nothing here depends on the library.
-->

<style>
  @property --amp {
    syntax: "<number>";
    inherits: true;
    initial-value: 0;
  }

  /* Amplitude exaggerated to 0.5 (spec ships 0.022) purely so the numbers are
     unambiguous on screen. Ratios are what matter, not absolute values. */
  @keyframes osc {
    to { transform: scaleX(calc(1 + 0.5 * var(--amp))); }
  }

  .rig { --amp: 0; }
  .rig.ramp { transition: --amp 400ms linear; }
  .rig.on { --amp: 1; }

  .osc {
    animation: osc 2800ms ease-in-out infinite alternate;
    /* Half a period, so the paused pose sits mid-cycle where the effect is
       non-zero. Pausing at a keyframe boundary would read as a false failure. */
    animation-delay: -1400ms;
  }
  .osc.paused { animation-play-state: paused; }

  /* Leg 5: running, but so slow that the oscillation itself contributes
     ~0.0008 of scaleX across a 500ms sample. Effectively a static pose that is
     nonetheless ticking — which isolates "does ticking drive re-substitution?"
     from "is the pose moving on its own?". */
  .osc.slow { animation-duration: 600s; animation-delay: -300s; }

  body { font: 14px/1.6 ui-monospace, monospace; margin: 2rem; max-width: 40rem; }
  svg { width: 60px; height: 60px; vertical-align: middle; }
  rect { fill: currentColor; }
  h1 { font-size: 1rem; }
  li { margin: .4rem 0; }
  .pass { color: #0a7d33; }
  .fail { color: #c02020; }
  .warn { color: #a06000; }
  pre { background: #f4f4f4; padding: .75rem; overflow-x: auto; }
</style>

<h1>--mo-amp / paused-animation probe</h1>

<p>
  <svg viewBox="0 0 100 100" class="rig" id="viz"><g class="osc paused" id="vizg"><rect x="30" y="30" width="40" height="40"/></g></svg>
  <button id="toggle">toggle --amp (ramped)</button>
  <span id="live"></span>
</p>

<ul id="out"></ul>
<pre id="detail"></pre>

<script>
const out = document.getElementById("out");
const detail = document.getElementById("detail");
const log = [];

function report(name, state, msg) {
  const li = document.createElement("li");
  li.className = state;
  li.textContent = `${state.toUpperCase().padEnd(4)}  ${name} — ${msg}`;
  out.appendChild(li);
  log.push(`${state}\t${name}\t${msg}`);
}

// scaleX out of the computed matrix. getComputedStyle on an SVG <g> returns a
// matrix, or "none" when the animation contributes nothing.
function scaleX(el) {
  const t = getComputedStyle(el).transform;
  if (!t || t === "none") return 1;
  return new DOMMatrixReadOnly(t).a;
}

function rig(paused, slow) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.classList.add("rig");
  svg.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.classList.add("osc");
  if (paused) g.classList.add("paused");
  if (slow) g.classList.add("slow");
  const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  r.setAttribute("width", "40"); r.setAttribute("height", "40");
  g.appendChild(r); svg.appendChild(g); document.body.appendChild(svg);
  return { svg, g, done: () => svg.remove() };
}

const frame = () => new Promise(requestAnimationFrame);
const near = (a, b, eps = 0.02) => Math.abs(a - b) < eps;

(async function run() {

  // 1 — substitution. Running animation, var flipped instantly. If this fails,
  //     var() in keyframes is broken outright and nothing else is meaningful.
  {
    const { g, svg, done } = rig(false);
    await frame();
    const before = scaleX(g);
    svg.classList.add("on");
    await frame(); await frame();
    const after = scaleX(g);
    if (near(before, 1, 0.03) && after > before + 0.05)
      report("1 substitution", "pass", `var() resolves in keyframes (${before.toFixed(3)} → ${after.toFixed(3)})`);
    else
      report("1 substitution", "fail", `expected ~1 → >1.05, got ${before.toFixed(3)} → ${after.toFixed(3)}. Everything below is moot.`);
    done();
  }

  // 2 — THE ONE THAT DECIDES THE ARCHITECTURE.
  //     Paused animation, var flipped instantly (no transition involved yet).
  {
    const { g, svg, done } = rig(true);
    await frame();
    const before = scaleX(g);
    svg.classList.add("on");
    await frame(); await frame();
    const after = scaleX(g);
    if (after > before + 0.05)
      report("2 paused-recalc", "pass", `paused effect re-resolved (${before.toFixed(3)} → ${after.toFixed(3)}). Spec §3 as written is viable.`);
    else
      report("2 paused-recalc", "fail", `frozen at ${after.toFixed(3)}. Take §3 fallback 1: keep animation-play-state:running and gate amplitude only.`);
    done();
  }

  // 3 — ramp. Same, but the var transitions. Samples across the ramp: a single
  //     jump means the pause is visible even though leg 2 passed.
  {
    const { g, svg, done } = rig(true);
    svg.classList.add("ramp");
    await frame();
    const start = scaleX(g);
    svg.classList.add("on");
    const seen = new Set();
    const t0 = performance.now();
    while (performance.now() - t0 < 520) { await frame(); seen.add(scaleX(g).toFixed(3)); }
    const end = scaleX(g);
    const steps = seen.size;
    if (steps >= 5 && end > start + 0.05)
      report("3 ramp", "pass", `${steps} distinct intermediate values across 400ms (${start.toFixed(3)} → ${end.toFixed(3)})`);
    else if (end > start + 0.05)
      report("3 ramp", "warn", `only ${steps} step(s) — the custom property is snapping, not interpolating. Check @property registration; the 400ms ease-out in §3 will look like a jump cut.`);
    else
      report("3 ramp", "fail", `no movement (${start.toFixed(3)} → ${end.toFixed(3)})`);
    done();
  }

  // 4 — return. The actual §3 claim: hover-out freezes the pose, but the
  //     amplitude easing to 0 pulls it back to neutral so the pause is invisible.
  {
    const { g, svg, done } = rig(true);
    svg.classList.add("ramp", "on");
    await frame(); await frame();
    const held = scaleX(g);
    svg.classList.remove("on");
    const t0 = performance.now();
    while (performance.now() - t0 < 620) await frame();
    const settled = scaleX(g);
    if (held > 1.05 && near(settled, 1, 0.02))
      report("4 return", "pass", `frozen pose ${held.toFixed(3)} eased back to ${settled.toFixed(3)}. The pause is invisible.`);
    else if (held > 1.05)
      report("4 return", "fail", `stuck at ${settled.toFixed(3)} — blobatars will freeze mid-squash on hover-out.`);
    else
      report("4 return", "fail", `never reached amplitude (held ${held.toFixed(3)})`);
    done();
  }

  // 5 — is it the PAUSE that blocks re-substitution? Same ramp, animation
  //     running but effectively frozen (600s period). If this interpolates
  //     where leg 3 snapped, the cause is "paused animations don't re-tick",
  //     and §3 fallback 1 is the fix.
  {
    const { g, svg, done } = rig(false, true);
    svg.classList.add("ramp");
    await frame();
    const start = scaleX(g);
    svg.classList.add("on");
    const seen = new Set();
    const t0 = performance.now();
    while (performance.now() - t0 < 520) { await frame(); seen.add(scaleX(g).toFixed(3)); }
    const steps = seen.size;
    if (steps >= 5)
      report("5 running-ramp", "pass", `${steps} steps while running (${start.toFixed(3)} → ${scaleX(g).toFixed(3)}). If leg 3 warned, the pause is the cause — take §3 fallback 1.`);
    else
      report("5 running-ramp", "warn", `only ${steps} step(s) even while running — pausing is not the cause. See leg 6.`);
    done();
  }

  // 6 — is --amp itself interpolating, independent of any keyframe? Reads the
  //     registered property directly. Separates "the property doesn't animate"
  //     from "the property animates but keyframes don't re-substitute".
  {
    const { svg, done } = rig(true);
    svg.classList.add("ramp");
    await frame();
    svg.classList.add("on");
    const seen = new Set();
    const t0 = performance.now();
    while (performance.now() - t0 < 520) {
      await frame();
      seen.add(getComputedStyle(svg).getPropertyValue("--amp").trim());
    }
    const steps = seen.size;
    if (steps >= 5)
      report("6 property-ramp", "pass", `--amp interpolates (${steps} distinct values). Any snapping above is keyframe re-substitution, not the transition.`);
    else
      report("6 property-ramp", "fail", `--amp jumps in ${steps} step(s) — the registered property is not transitioning at all. @property registration or transition support is the problem, not the animation.`);
    done();
  }

  const ua = navigator.userAgent;
  detail.textContent = log.join("\n") + "\n\n" + ua;
})();

// Manual rig: watch the pose ramp in and out while the animation stays paused.
const viz = document.getElementById("viz");
const vizg = document.getElementById("vizg");
const live = document.getElementById("live");
viz.classList.add("ramp");
document.getElementById("toggle").onclick = () => viz.classList.toggle("on");
(function tick() {
  live.textContent = `scaleX ${scaleX(vizg).toFixed(3)} · animation paused`;
  requestAnimationFrame(tick);
})();
</script>
