<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">Visual design review: controlled comparisons</title>
  <desc id="desc">Three original schematic comparisons: uniform versus grouped spacing, a triangle at its bounding-box center versus a candidate optical offset, and dense versus simplified icon detail. Candidates require evaluation at actual size.</desc>
  <rect width="960" height="650" fill="#f6f7f9"/>
  <g font-family="system-ui, sans-serif" fill="#202631">
    <text x="48" y="52" font-size="25" font-weight="600">Visual checks, not universal formulas</text>
    <text x="48" y="83" font-size="16">Original teaching diagrams · compare under identical display conditions</text>
    <text x="260" y="127" font-size="17" font-weight="600">Baseline</text>
    <text x="615" y="127" font-size="17" font-weight="600">Candidate</text>
    <path d="M48 144H912 M48 293H912 M48 442H912" stroke="#bac1ca"/>
    <text x="48" y="182" font-size="17" font-weight="600">01 Proximity</text>
    <text x="48" y="208" font-size="14">Spacing carries</text>
    <text x="48" y="229" font-size="14">group structure.</text>
    <g fill="#3466aa">
      <circle cx="286" cy="208" r="13"/><circle cx="333" cy="208" r="13"/>
      <circle cx="380" cy="208" r="13"/><circle cx="427" cy="208" r="13"/>
      <circle cx="641" cy="208" r="13"/><circle cx="676" cy="208" r="13"/>
      <circle cx="770" cy="208" r="13"/><circle cx="805" cy="208" r="13"/>
    </g>
    <text x="260" y="262" font-size="14">Uniform spacing: one sequence</text>
    <text x="615" y="262" font-size="14">Larger separation: two pairs</text>
    <text x="48" y="331" font-size="17" font-weight="600">02 Alignment</text>
    <text x="48" y="357" font-size="14">Geometry starts</text>
    <text x="48" y="378" font-size="14">the comparison.</text>
    <rect x="304" y="316" width="104" height="76" rx="16" fill="#202631"/>
    <rect x="671" y="316" width="104" height="76" rx="16" fill="#202631"/>
    <path d="M339 334L373 354L339 374Z M712 334L746 354L712 374Z" fill="#fff"/>
    <path d="M356 308V400 M723 308V400" stroke="#c77917" stroke-dasharray="4 4"/>
    <text x="260" y="420" font-size="14">Bounding box centered</text>
    <text x="615" y="420" font-size="14">Small offset; judge without guides</text>
    <text x="48" y="480" font-size="17" font-weight="600">03 Small sizes</text>
    <text x="48" y="506" font-size="14">Inspect detail at</text>
    <text x="48" y="527" font-size="14">the target size.</text>
    <g fill="none" stroke="#202631" stroke-width="2">
      <circle cx="356" cy="503" r="30"/><circle cx="356" cy="503" r="25"/>
      <circle cx="356" cy="503" r="20"/><circle cx="356" cy="503" r="15"/>
    </g>
    <g fill="none" stroke="#202631" stroke-width="0.667">
      <circle cx="420" cy="503" r="10"/><circle cx="420" cy="503" r="8.33"/>
      <circle cx="420" cy="503" r="6.67"/><circle cx="420" cy="503" r="5"/>
    </g>
    <g fill="none" stroke="#202631" stroke-width="2">
      <circle cx="723" cy="503" r="30"/><circle cx="723" cy="503" r="16"/>
    </g>
    <g fill="none" stroke="#202631" stroke-width="0.667">
      <circle cx="787" cy="503" r="10"/><circle cx="787" cy="503" r="5.33"/>
    </g>
    <text x="260" y="561" font-size="14">Dense detail may merge when reduced</text>
    <text x="615" y="561" font-size="14">Simplify only if meaning is preserved</text>
    <text x="48" y="614" font-size="15">No Apple assets or measurements. A candidate is a hypothesis, not an automatic improvement.</text>
  </g>
</svg>
