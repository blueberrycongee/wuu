name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  desktop-macos:
    name: Desktop macOS
    runs-on: macos-15
    timeout-minutes: 120
    env:
      WUU_RELEASE_TEAM_ID: ${{ secrets.WUU_RELEASE_TEAM_ID }}
      WUU_RELEASE_SIGN_ID: ${{ secrets.WUU_RELEASE_SIGN_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json

      - name: Verify tag source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag ${GITHUB_REF_NAME} must point to a commit on main"
            exit 1
          fi

      - name: Check release version
        run: |
          node --test ../scripts/release-version.test.mjs
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node ../scripts/release-version.mjs check "$GITHUB_REF_NAME"
          else
            node ../scripts/release-version.mjs check
          fi

      - name: Install release credentials
        env:
          WUU_RELEASE_CERTIFICATE_P12: ${{ secrets.WUU_RELEASE_CERTIFICATE_P12 }}
          WUU_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.WUU_RELEASE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          node scripts/install-notary-key.cjs
          node scripts/import-release-signing.cjs

      - name: Validate notarization credentials
        run: |
          xcrun notarytool history --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json > /dev/null

      - name: Check and test Go packages
        run: make -C .. check-go test-go-uncached

      - name: Install
        run: |
          npm ci
          npm ci --prefix ../plugins
          npm ci --prefix ../clients/core
          npm ci --prefix ../clients/mobile-web
          node node_modules/electron/install.js
          node -e 'require("electron")'

      - name: Test
        timeout-minutes: 10
        run: |
          make -C .. check-plugins test-plugins
          npm test
          npm run test:release-signing
          npm run test:cua-mac
          node --test scripts/test-notarization.cjs

      - name: Build desktop release
        run: npm run release:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VITE_ENABLE_ACCOUNT: "false"
          VITE_ENABLE_REMOTE_CONTROL: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Verify packaged app
        run: |
          WUU_RELEASE=1 node scripts/verify-mac-release.cjs

          core="release/mac-arm64/wuu.app/Contents/Resources/bin/wuu-core"
          version_output="$("$core" --version)"
          echo "$version_output"
          if echo "$version_output" | grep -q dirty; then
            echo "::error::Packaged core was built from a dirty worktree."
            exit 1
          fi

          if [ -e "release/mac-arm64/wuu.app/Contents/Resources/bin/wuu" ]; then
            echo "::error::Packaged app must keep its core private as wuu-core."
            exit 1
          fi

          hdiutil verify release/wuu-*-mac-arm64.dmg
          unzip -t release/wuu-*-mac-arm64.zip >/tmp/wuu-desktop-zip-test.txt

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.zip.blockmap
            desktop/release/verification.json
          if-no-files-found: error

      - name: Upload notarization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-evidence
          path: |
            desktop/release/notarization/*.json
            desktop/release/verification.json
          if-no-files-found: ignore

      - name: Remove release credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/wuu-release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/wuu-release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/wuu-notary.p8" "$RUNNER_TEMP/wuu-release.p12"

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - desktop-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: desktop-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-version.mjs notes "$GITHUB_REF_NAME" > release-notes.md
          printf '\n\n' >> release-notes.md
          cat >> release-notes.md <<'EOF'
          This release contains the macOS arm64 desktop app:

          - `wuu-<version>-mac-arm64.dmg`
          - `wuu-<version>-mac-arm64.zip`

          The app includes its own private wuu core. Standalone CLI archives are not published.

          This app is signed with Apple Developer ID and notarized. Both the DMG and ZIP contain an app with a stapled notarization ticket. Final packages pass signature and Gatekeeper assessment before publication.

          To update, quit Wuu with Cmd+Q, wait for it to exit, then replace `/Applications/wuu.app` with the new app. Open that copy, not the copy inside the DMG. No separate CUA helper installation or certificate import is needed.

          Computer Use is included. Grant Screen Recording and Accessibility permissions in System Settings when requested to observe and control native macOS apps.

          EOF

          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" desktop-release/* \
            --verify-tag \
            --title "wuu ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${release_args[@]}"
