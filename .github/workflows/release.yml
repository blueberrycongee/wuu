name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  desktop-macos:
    name: Desktop macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json

      - name: Verify tag source
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag ${GITHUB_REF_NAME} must point to a commit on main"
            exit 1
          fi

      - name: Check release version
        run: node ../scripts/release-version.mjs check "$GITHUB_REF_NAME"

      - name: Check and test Go packages
        run: make -C .. check-go test-go-uncached

      - name: Install
        run: |
          npm ci
          npm ci --prefix ../clients/core
          npm ci --prefix ../clients/mobile-web
          node node_modules/electron/install.js
          node -e 'require("electron")'

      - name: Test
        run: |
          npm test
          npm run test:cua-mac
          npm run test:release-signing

      - name: Import persistent release signing identity
        run: node scripts/import-release-signing.cjs
        env:
          WUU_RELEASE_CERTIFICATE_P12: ${{ secrets.WUU_RELEASE_CERTIFICATE_P12 }}
          WUU_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.WUU_RELEASE_CERTIFICATE_PASSWORD }}
          WUU_RELEASE_SIGN_ID: ${{ secrets.WUU_RELEASE_SIGN_ID }}

      - name: Build desktop release
        run: npm run release:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VITE_ENABLE_ACCOUNT: "false"
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Verify packaged app
        run: |
          node scripts/verify-mac-release.cjs
          echo "::notice::macOS preview uses a persistent self-signed identity and is not notarized."

          core="release/mac-arm64/wuu.app/Contents/Resources/bin/wuu-core"
          version_output="$("$core" --version)"
          echo "$version_output"
          if echo "$version_output" | grep -q dirty; then
            echo "::error::Packaged core was built from a dirty worktree."
            exit 1
          fi

          if [ -e "release/mac-arm64/wuu.app/Contents/Resources/bin/wuu" ]; then
            echo "::error::Packaged app must keep its core private as wuu-core."
            exit 1
          fi

          hdiutil verify release/wuu-*-mac-arm64.dmg
          unzip -t release/wuu-*-mac-arm64.zip >/tmp/wuu-desktop-zip-test.txt

      - name: Remove release signing keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/wuu-release-signing.pem" ]; then
            sudo -n security remove-trusted-cert -d "$RUNNER_TEMP/wuu-release-signing.pem"
            rm "$RUNNER_TEMP/wuu-release-signing.pem"
          fi
          if [ -f "$RUNNER_TEMP/wuu-release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/wuu-release.keychain-db"
          fi

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error

  release:
    name: GitHub Release
    needs:
      - desktop-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: desktop-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-version.mjs notes "$GITHUB_REF_NAME" > release-notes.md
          printf '\n\n' >> release-notes.md
          cat >> release-notes.md <<'EOF'
          This release contains the macOS arm64 desktop app:

          - `wuu-<version>-mac-arm64.dmg`
          - `wuu-<version>-mac-arm64.zip`

          The app includes its own private wuu core. Standalone CLI archives are not published.

          The app uses a persistent self-signed identity, without Apple Developer ID or notarization. After moving `wuu.app` to `/Applications`, macOS may block it. For the official asset you trust, try opening it, then use System Settings → Privacy & Security → Open Anyway.

          To update, quit Wuu with Cmd+Q, wait for it to exit, then replace `/Applications/wuu.app` with the new app. Open that copy, not the copy inside the DMG. No separate CUA helper installation or certificate import is needed.

          Computer Use is included. macOS may request Accessibility and Screen Recording access on first use. Moving from an older unsigned/ad-hoc build can require authorization again. Persistent signing reduces identity changes; it does not guarantee permission retention across all macOS updates. Do not reset privacy permissions as a routine upgrade step.

          EOF

          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" desktop-release/* \
            --verify-tag \
            --title "wuu ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${release_args[@]}"
