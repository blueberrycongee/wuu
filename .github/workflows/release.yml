name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  desktop-macos:
    name: Desktop macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json

      - name: Verify tag source
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag ${GITHUB_REF_NAME} must point to a commit on main"
            exit 1
          fi

      - name: Check release version
        run: node ../scripts/release-version.mjs check "$GITHUB_REF_NAME"

      - name: Check and test Go packages
        run: make -C .. check-go test-go-uncached

      - name: Install
        run: |
          npm ci
          npm ci --prefix ../clients/core
          npm ci --prefix ../clients/mobile-web
          node node_modules/electron/install.js
          node -e 'require("electron")'

      - name: Test
        run: |
          npm test
          npm run test:cua-mac

      - name: Build desktop release
        run: npm run release:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Verify packaged app
        run: |
          echo "::notice::macOS desktop artifacts are unsigned preview builds; users may need to remove Gatekeeper quarantine after installing."

          core="release/mac-arm64/wuu.app/Contents/Resources/bin/wuu-core"
          version_output="$("$core" --version)"
          echo "$version_output"
          if echo "$version_output" | grep -q dirty; then
            echo "::error::Packaged core was built from a dirty worktree."
            exit 1
          fi

          if [ -e "release/mac-arm64/wuu.app/Contents/Resources/bin/wuu" ]; then
            echo "::error::Packaged app must keep its core private as wuu-core."
            exit 1
          fi

          cua_helper="release/mac-arm64/wuu.app/Contents/Resources/bin/wuu-cua-mac"
          if [ -e "$cua_helper" ]; then
            echo "::error::Packaged app must not include the internal CUA helper."
            exit 1
          fi

          speech_helper="release/mac-arm64/wuu.app/Contents/Resources/bin/wuu-speech-mac"
          if [ -e "$speech_helper" ]; then
            echo "::error::Packaged app must not include the internal speech helper."
            exit 1
          fi

          if plutil -extract NSScreenCaptureUsageDescription raw -o - release/mac-arm64/wuu.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "::error::Packaged app must not include the CUA screen-capture permission declaration."
            exit 1
          fi

          for permission in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription; do
            if plutil -extract "$permission" raw -o - release/mac-arm64/wuu.app/Contents/Info.plist >/dev/null 2>&1; then
              echo "::error::Packaged app must not include $permission."
              exit 1
            fi
          done

          hdiutil verify release/wuu-*-mac-arm64.dmg
          unzip -t release/wuu-*-mac-arm64.zip >/tmp/wuu-desktop-zip-test.txt

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error

  release:
    name: GitHub Release
    needs:
      - desktop-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: desktop-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-version.mjs notes "$GITHUB_REF_NAME" > release-notes.md
          printf '\n\n' >> release-notes.md
          cat >> release-notes.md <<'EOF'
          This release contains only the unsigned macOS arm64 desktop app:

          - `wuu-<version>-mac-arm64.dmg`
          - `wuu-<version>-mac-arm64.zip`

          The app includes its own private wuu core. Standalone CLI archives are not published.

          The app is not signed or notarized yet. After moving `wuu.app` to `/Applications`, macOS may block it. For a release asset you trust, remove the quarantine attribute:

          ```bash
          xattr -dr com.apple.quarantine /Applications/wuu.app
          open /Applications/wuu.app
          ```

          EOF

          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" desktop-release/* \
            --verify-tag \
            --title "wuu ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${release_args[@]}"
