name: Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "desktop/**"
      - "clients/core/**"
      - "clients/mobile-web/**"
      - "plugins/**"
      - "packages/**"
      - "internal/**"
      - "cmd/**"
      - "scripts/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - ".node-version"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "desktop/**"
      - "clients/core/**"
      - "clients/mobile-web/**"
      - "plugins/**"
      - "packages/**"
      - "internal/**"
      - "cmd/**"
      - "scripts/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - ".node-version"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            plugins/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install bundled plugin dependencies
        working-directory: desktop
        run: npm ci --prefix ../plugins

      - name: Install core client dependencies
        working-directory: desktop
        run: npm ci --prefix ../clients/core

      - name: Install mobile web dependencies
        working-directory: desktop
        run: npm ci --prefix ../clients/mobile-web

      - name: Verify Electron runtime
        working-directory: desktop
        run: |
          node node_modules/electron/install.js
          node -e "const electron = require('electron'); if (!electron) process.exit(1); console.log(electron)"

      - name: Build Windows installer and portable archive
        working-directory: desktop
        run: npm run dist:win

      - name: Verify packaged Windows runtime
        working-directory: desktop
        run: node scripts/verify-windows-package.cjs

      - name: Upload Windows desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: wuu-windows-x64-${{ github.sha }}
          path: |
            desktop/release/wuu-win-x64-setup.exe
            desktop/release/wuu-win-x64.zip
            desktop/release/*.yml
            desktop/release/*.blockmap
            desktop/release/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 14
