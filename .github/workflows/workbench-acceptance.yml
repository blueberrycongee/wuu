name: Workbench visual acceptance

on:
  push:
    branches: [design/conversation-layout, experiment/workbench]
    paths:
      - 'desktop/src/**'
      - 'desktop/scripts/workbench-acceptance-e2e.cjs'
      - 'desktop/scripts/web-workspace-acceptance.cjs'
      - 'desktop/scripts/browser-media-acceptance.cjs'
      - 'desktop/scripts/browser-task-ownership-e2e*'
      - 'desktop/scripts/browser-pip-e2e*'
      - 'desktop/scripts/browser-session-recovery-e2e*'
      - 'desktop/scripts/browser-media-permissions-e2e*'
      - 'desktop/scripts/browser-download-recovery-e2e*'
      - 'desktop/scripts/browser-extension-options-e2e*'
      - 'desktop/scripts/browser-display-capture-e2e*'
      - 'desktop/scripts/browser-library-edit-e2e*'
      - 'desktop/scripts/browser-ribbon-e2e*'
      - 'desktop/scripts/browser-popover-stability-e2e*'
      - 'packages/protocol/**'
      - 'desktop/scripts/context-chat-capsule-e2e*'
      - 'internal/**'
      - 'scripts/plugin-credentials-e2e/**'
      - 'plugins/feishu-workspace/**'
      - 'plugins/notion-workspace/**'
      - 'desktop/scripts/fixtures/conversation-corpus/**'
      - 'desktop/electron.vite.config.ts'
      - 'desktop/package*.json'
      - '.github/workflows/workbench-acceptance.yml'
  pull_request:
    branches: [experiment/workbench]
    paths:
      - 'desktop/src/**'
      - 'desktop/scripts/workbench-acceptance-e2e.cjs'
      - 'desktop/scripts/web-workspace-acceptance.cjs'
      - 'desktop/scripts/browser-media-acceptance.cjs'
      - 'desktop/scripts/browser-task-ownership-e2e*'
      - 'desktop/scripts/browser-pip-e2e*'
      - 'desktop/scripts/browser-session-recovery-e2e*'
      - 'desktop/scripts/browser-media-permissions-e2e*'
      - 'desktop/scripts/browser-download-recovery-e2e*'
      - 'desktop/scripts/browser-extension-options-e2e*'
      - 'desktop/scripts/browser-display-capture-e2e*'
      - 'desktop/scripts/browser-library-edit-e2e*'
      - 'desktop/scripts/browser-ribbon-e2e*'
      - 'desktop/scripts/browser-popover-stability-e2e*'
      - 'packages/protocol/**'
      - 'desktop/scripts/context-chat-capsule-e2e*'
      - 'internal/**'
      - 'scripts/plugin-credentials-e2e/**'
      - 'plugins/feishu-workspace/**'
      - 'plugins/notion-workspace/**'
      - 'desktop/scripts/fixtures/conversation-corpus/**'
      - 'desktop/electron.vite.config.ts'
      - 'desktop/package*.json'
      - '.github/workflows/workbench-acceptance.yml'
  workflow_dispatch:
    inputs:
      layout_matrix:
        description: Repeated layout matrix (browser journeys always run)
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

concurrency:
  group: workbench-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accept:
    name: Real Electron clickthrough and video
    # Match the package check: Chromium sandbox uses unprivileged namespaces.
    # Stock Ubuntu24.04 restricts them; do not weaken the extension sandbox.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install isolated capture dependencies
        run: |
          npm ci --prefix desktop
          node desktop/node_modules/electron/install.js
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg openbox xdotool fonts-noto-cjk fonts-noto-color-emoji pulseaudio pulseaudio-utils
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=wuu_e2e sink_properties=device.description=WuuE2E
          pactl set-default-sink wuu_e2e
      - name: Check acceptance syntax and test policy
        run: |
          node --check desktop/scripts/workbench-acceptance-e2e.cjs
          node --check desktop/scripts/web-workspace-acceptance.cjs
          node --check desktop/scripts/browser-media-acceptance.cjs
          node --check desktop/scripts/browser-pip-e2e.cjs
          for journey in session-recovery media-permissions download-recovery extension-options display-capture library-edit ribbon popover-stability; do
            node --check "desktop/scripts/browser-$journey-e2e.cjs"
          done
          node --check desktop/scripts/context-chat-capsule-e2e.cjs
          make test-policy-check
      - name: Build shipping app serially
        id: build
        run: |
          mkdir -p desktop/build/bin
          go build -p 2 -ldflags "-X github.com/blueberrycongee/wuu/internal/version.Version=v$(cat VERSION)" -o desktop/build/bin/wuu-core ./cmd/wuu
          cd desktop
          node_modules/.bin/electron-vite build
      - name: Record real-window acceptance
        id: ui
        timeout-minutes: 10
        env:
          WUU_WORKBENCH_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance
          WUU_WORKBENCH_MATRIX: ${{ inputs.layout_matrix || 'smoke' }}
        shell: bash
        run: |
          mkdir -p "$WUU_WORKBENCH_OUTPUT"
          git rev-parse HEAD > "$WUU_WORKBENCH_OUTPUT/source-commit.txt"
          git ls-files desktop/src desktop/electron.vite.config.ts desktop/scripts/workbench-acceptance-e2e.cjs desktop/scripts/web-workspace-acceptance.cjs desktop/scripts/browser-media-acceptance.cjs | sort | xargs sha256sum > "$WUU_WORKBENCH_OUTPUT/source-sha256.txt"
          find desktop/out -type f -print0 | sort -z | xargs -0 sha256sum > "$WUU_WORKBENCH_OUTPUT/build-sha256.txt"
          set -o pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' bash <<'CAPTURE' 2>&1 | tee "$WUU_WORKBENCH_OUTPUT/run.log"
          set -uo pipefail
          openbox --sm-disable > "$WUU_WORKBENCH_OUTPUT/window-manager.log" 2>&1 &
          wm=$!
          ffmpeg -hide_banner -loglevel warning -f x11grab -draw_mouse 1 -framerate 20 -video_size 1600x1000 -i "$DISPLAY" -an -c:v libx264 -preset ultrafast -crf 22 -pix_fmt yuv420p -movflags +frag_keyframe+empty_moov+default_base_moof "$WUU_WORKBENCH_OUTPUT/workbench-clickthrough.mp4" > "$WUU_WORKBENCH_OUTPUT/ffmpeg.log" 2>&1 &
          recorder=$!
          cleanup() {
            # TERM also works if launch failed before ffmpeg installed its
            # interrupt handler; never let recorder cleanup hold the job open.
            kill -TERM "$recorder" 2>/dev/null || true
            for attempt in $(seq 1 50); do
              kill -0 "$recorder" 2>/dev/null || break
              sleep 0.1
            done
            kill -KILL "$recorder" 2>/dev/null || true
            wait "$recorder" || true
            kill "$wm" 2>/dev/null || true
          }
          trap cleanup EXIT
          # A synchronous native modal can block the in-process JS watchdog.
          # Keep an independent process bound, leaving time to finalize video.
          timeout --signal=TERM --kill-after=10s 510s desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/workbench-acceptance-e2e.cjs
          result=$?
          node -e 'const r=require(process.env.WUU_WORKBENCH_OUTPUT+"/report.json"); if(r.status!=="passed")process.exit(1)' || result=1
          cleanup
          trap - EXIT
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "$WUU_WORKBENCH_OUTPUT/workbench-clickthrough.mp4" > "$WUU_WORKBENCH_OUTPUT/video.json" || exit 1
          exit "$result"
          CAPTURE
      - name: Upload immediate UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-ui-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wuu-workbench-acceptance/report.json
            ${{ runner.temp }}/wuu-workbench-acceptance/run.log
            ${{ runner.temp }}/wuu-workbench-acceptance/source-commit.txt
            ${{ runner.temp }}/wuu-workbench-acceptance/video.json
            ${{ runner.temp }}/wuu-workbench-acceptance/*failure*.png
            ${{ runner.temp }}/wuu-workbench-acceptance/native-dialog-*.png.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify browser ownership and adopted plugin views
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        env:
          WUU_BROWSER_OWNERSHIP_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/browser-ownership
        run: |
          mkdir -p "$WUU_BROWSER_OWNERSHIP_OUTPUT"
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 6m xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' node desktop/scripts/browser-task-ownership-e2e.cjs 2>&1 | tee "$WUU_BROWSER_OWNERSHIP_OUTPUT/run.log"
      - name: Verify synthetic browser extension lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        env:
          WUU_BROWSER_EXTENSION_E2E_ONLY: '1'
          WUU_BROWSER_PIP_E2E_ARTIFACTS: ${{ runner.temp }}/wuu-workbench-acceptance/browser-extensions
        working-directory: desktop
        run: |
          mkdir -p "$WUU_BROWSER_PIP_E2E_ARTIFACTS"
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 2m xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' node scripts/browser-pip-e2e.cjs 2>&1 | tee "$WUU_BROWSER_PIP_E2E_ARTIFACTS/run.log"
      - name: Verify daily browser recovery, permissions and extension settings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          WUU_BROWSER_SESSION_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/browser-session-recovery
          WUU_MEDIA_PERMISSIONS_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/browser-media-permissions
          WUU_DOWNLOAD_RECOVERY_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/browser-download-recovery
          WUU_EXTENSION_OPTIONS_ARTIFACTS: ${{ runner.temp }}/wuu-workbench-acceptance/browser-extension-options
          WUU_DISPLAY_CAPTURE_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/browser-display-capture
          WUU_LIBRARY_EDIT_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/browser-library-edit
          WUU_RIBBON_E2E_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/browser-ribbon
          WUU_POPOVER_STABILITY_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/browser-popover-stability
          WUU_WORKBENCH_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance
        run: |
          mkdir -p "$WUU_WORKBENCH_OUTPUT"
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 4m xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' bash <<'JOURNEYS' 2>&1 | tee "$WUU_WORKBENCH_OUTPUT/browser-daily.log"
          result=0
          for journey in session-recovery media-permissions download-recovery extension-options display-capture library-edit ribbon popover-stability; do
            node "desktop/scripts/browser-$journey-e2e.cjs" || result=1
          done
          exit "$result"
          JOURNEYS
      - name: Verify context capsule with authored loopback provider
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        env:
          WUU_CAPSULE_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/context-capsule
        run: |
          mkdir -p "$WUU_CAPSULE_OUTPUT"
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 160s xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/context-chat-capsule-e2e.mjs 2>&1 | tee "$WUU_CAPSULE_OUTPUT/run.log"
      - name: Verify synthetic credential host boundary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        env:
          WUU_WORKBENCH_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance
          WUU_CREDENTIAL_E2E_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/plugin-credentials
        run: |
          mkdir -p "$WUU_WORKBENCH_OUTPUT"
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 2m go run ./scripts/plugin-credentials-e2e 2>&1 | tee "$WUU_WORKBENCH_OUTPUT/plugin-credentials.log"
      - name: Verify Feishu synthetic API journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 2
        env:
          WUU_FEISHU_E2E_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/feishu
        run: |
          mkdir -p "$WUU_FEISHU_E2E_OUTPUT"
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 90s node plugins/feishu-workspace/scripts/api-acceptance.mjs 2>&1 | tee "$WUU_FEISHU_E2E_OUTPUT/run.log"
      - name: Verify Notion synthetic API journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 2
        env:
          WUU_NOTION_E2E_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance/notion
        run: |
          mkdir -p "$WUU_NOTION_E2E_OUTPUT"
          set -o pipefail
          result=0
          timeout --signal=TERM --kill-after=10s 90s node plugins/notion-workspace/scripts/api-e2e.mjs 2>&1 | tee "$WUU_NOTION_E2E_OUTPUT/run.log" || result=$?
          if [ -f .tmp/notion-workspace-e2e/report.json ]; then cp .tmp/notion-workspace-e2e/report.json "$WUU_NOTION_E2E_OUTPUT/report.json"; fi
          exit "$result"
      - name: Summarize checked journeys
        if: always()
        env:
          WUU_WORKBENCH_OUTPUT: ${{ runner.temp }}/wuu-workbench-acceptance
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = `${process.env.WUU_WORKBENCH_OUTPUT}/report.json`;
          if (!fs.existsSync(path)) process.exit(0);
          const r = JSON.parse(fs.readFileSync(path));
          const rows = r.checks.map(c => `- ${c.status === 'passed' ? 'PASS' : 'FAIL'} ${c.name}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [`## Workbench: ${r.status}`, `Commit: ${r.commit}`, `Layout matrix: ${r.layoutMatrixScope || "full"}; all browser journeys run.`, `${r.screenshots.length} full-window PNGs plus real-time MP4 in the evidence artifact.`, ...rows, '', 'Not covered:', ...r.exclusions.map(s => `- ${s}`), ''].join('\n'));
          NODE
      - name: Upload full-window evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-acceptance-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/wuu-workbench-acceptance/
          if-no-files-found: warn
          retention-days: 14
