name: Native mobile

on:
  pull_request:
    paths:
      - "clients/native/**"
      - "assets/app-icon-source.json"
      - "desktop/src/renderer/*Avatar*.tsx"
      - "desktop/src/renderer/WuuMascot*.tsx"
      - "desktop/src/renderer/useMascot*.ts"
      - "desktop/src/renderer/wuu-mascot-spec.ts"
      - "desktop/src/renderer/ProcessSummary.ts"
      - "desktop/src/renderer/ToolActivityHelpers.ts"
      - "desktop/src/renderer/UserFacingErrors.ts"
      - "desktop/src/renderer/message-flow-display.ts"
      - "desktop/src/renderer/i18n/**"
      - "desktop/src/renderer/styles/*avatar*.css"
      - "desktop/src/renderer/styles/wuu-mascot.css"
      - "desktop/vendor/blobatar/**"
      - "internal/**"
      - "packages/plugin-go/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - ".github/workflows/native-mobile.yml"
  push:
    branches: [main]
    paths:
      - "clients/native/**"
      - "assets/app-icon-source.json"
      - "desktop/src/renderer/*Avatar*.tsx"
      - "desktop/src/renderer/WuuMascot*.tsx"
      - "desktop/src/renderer/useMascot*.ts"
      - "desktop/src/renderer/wuu-mascot-spec.ts"
      - "desktop/src/renderer/ProcessSummary.ts"
      - "desktop/src/renderer/ToolActivityHelpers.ts"
      - "desktop/src/renderer/UserFacingErrors.ts"
      - "desktop/src/renderer/message-flow-display.ts"
      - "desktop/src/renderer/i18n/**"
      - "desktop/src/renderer/styles/*avatar*.css"
      - "desktop/src/renderer/styles/wuu-mascot.css"
      - "desktop/vendor/blobatar/**"
      - "internal/**"
      - "packages/plugin-go/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - ".github/workflows/native-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL tools
        run: |
          brew install postgresql@18
          echo "WUU_TEST_PG_BIN=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - name: Core, real-server integration and simulator build
        run: bash clients/native/verify.sh ios | tee native-ios-core.log
      - name: Unsigned iOS device Release build
        run: |
          xcodebuild -project clients/native/ios/Wuu.xcodeproj -scheme Wuu \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath clients/native/ios/.build-xcode CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee native-ios-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-results
          retention-days: 7
          include-hidden-files: true
          path: |
            native-ios-*.log

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "WUU_TEST_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: Core, real-server integration and APK build
        run: bash clients/native/verify.sh android | tee native-android-core.log
      - name: Unsigned Android Release and lint
        run: |
          clients/native/android/gradlew -p clients/native/android \
            :app:assembleRelease :app:bundleRelease :app:lintRelease 2>&1 | tee native-android-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-results
          retention-days: 7
          path: |
            native-android-*.log
            clients/native/android/app/build/reports/lint-results-release.*
            clients/native/android/app/build/reports/tests
