name: Native mobile

on:
  pull_request:
    paths:
      - "clients/native/ios/**"
      - "clients/native/shared-ui/**"
      - "clients/native/testhost/**"
      - "clients/native/testaccount/**"
      - "clients/native/testsupport/**"
      - "clients/native/*.sh"
      - "internal/remote/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/native-mobile.yml"
  push:
    branches: [main]
    paths:
      - "clients/native/ios/**"
      - "clients/native/shared-ui/**"
      - "clients/native/testhost/**"
      - "clients/native/testaccount/**"
      - "clients/native/testsupport/**"
      - "clients/native/*.sh"
      - "internal/remote/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/native-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL tools
        run: |
          brew install postgresql@18
          echo "WUU_TEST_PG_BIN=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - name: Core, real-server integration and simulator build
        run: bash clients/native/verify.sh ios | tee native-ios-core.log
      - name: Capture native preview fixture layouts
        run: |
          set -euo pipefail
          mkdir -p native-ios-preview
          device="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for device in devices if device["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          trap 'xcrun simctl shutdown "$device"' EXIT
          xcrun simctl install "$device" clients/native/ios/.build-xcode/Build/Products/Debug-iphonesimulator/Wuu.app
          xcrun simctl ui "$device" appearance light
          xcrun simctl launch --terminate-running-process "$device" ai.wuu.native \
            --native-ui-fixture --native-composer-fixture --native-preview-fixture
          sleep 3
          xcrun simctl io "$device" screenshot native-ios-preview/tool-row-light.png
          xcrun simctl launch --terminate-running-process "$device" ai.wuu.native \
            --native-ui-fixture --native-composer-fixture --native-preview-fixture --native-preview-presented
          sleep 3
          xcrun simctl io "$device" screenshot native-ios-preview/viewer-light.png
          xcrun simctl ui "$device" appearance dark
          xcrun simctl launch --terminate-running-process "$device" ai.wuu.native \
            --native-ui-fixture --native-composer-fixture --native-preview-fixture --native-preview-presented \
            -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityXXXL
          sleep 3
          xcrun simctl io "$device" screenshot native-ios-preview/viewer-dark-large-text.png
          container="$(xcrun simctl get_app_container "$device" ai.wuu.native data)"
          marker="$container/Library/Caches/preview-fixture-result.json"
          rm -f "$marker"
          xcrun simctl launch --terminate-running-process "$device" ai.wuu.native \
            --native-ui-fixture --native-composer-fixture --native-preview-fixture --native-preview-presented \
            --native-preview-h264-fixture -UIPreferredContentSizeCategoryName UICTContentSizeCategoryL
          for attempt in $(seq 1 30); do
            [[ -f "$marker" ]] && break
            sleep 1
          done
          cp "$marker" native-ios-preview/h264-result.json
          sleep 1
          xcrun simctl io "$device" screenshot native-ios-preview/viewer-h264.png
          python3 -c 'import json; result=json.load(open("native-ios-preview/h264-result.json")); assert result.get("codec") == "h264" and result.get("decoded_frames") == 3 and result.get("submitted_frames") == 3 and result.get("error") == "", result'
          printf '%s\n' 'Local synthetic JPEG and H264 IDR+2 dependent delta frames through the native viewer. H264 decode/submission is asserted; screenshots require visual review. This does not validate remote latency, real macOS capture, or physical-device performance.' > native-ios-preview/scope.txt
      - name: Unsigned iOS device Release build
        run: |
          xcodebuild -project clients/native/ios/Wuu.xcodeproj -scheme Wuu \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath clients/native/ios/.build-xcode CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee native-ios-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-results
          retention-days: 7
          include-hidden-files: true
          path: |
            native-ios-*.log
            native-ios-preview/

  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "WUU_TEST_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: Core, real-server integration and APK build
        run: bash clients/native/verify.sh android | tee native-android-core.log
      - name: Unsigned Android Release and lint
        run: |
          clients/native/android/gradlew -p clients/native/android \
            :app:assembleRelease :app:bundleRelease :app:lintRelease 2>&1 | tee native-android-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-results
          retention-days: 7
          path: |
            native-android-*.log
            clients/native/android/app/build/reports/lint-results-release.*
            clients/native/android/app/build/reports/tests
