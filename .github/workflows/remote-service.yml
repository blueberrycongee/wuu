name: Remote service

on:
  pull_request:
    paths:
      - "internal/**"
      - "packages/plugin-go/**"
      - "cmd/wuu-server/**"
      - "deploy/remote/**"
      - "clients/native/with-postgres.sh"
      - "go.mod"
      - "go.sum"
      - ".node-version"
      - ".github/workflows/remote-service.yml"
  push:
    branches: [main]
    paths:
      - "internal/**"
      - "packages/plugin-go/**"
      - "cmd/wuu-server/**"
      - "deploy/remote/**"
      - "clients/native/with-postgres.sh"
      - "go.mod"
      - "go.sum"
      - ".node-version"
      - ".github/workflows/remote-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "WUU_TEST_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: Remote behavior tests
        # PR/main Go check already runs these with PostgreSQL enabled.
        if: github.event_name == 'workflow_dispatch'
        run: bash clients/native/with-postgres.sh go test ./internal/remote/... -count=1
      - name: Deployment lifecycle and WebSocket probes
        run: |
          mkdir -p clients/native/.build
          go build -o clients/native/.build/wuu-server ./cmd/wuu-server
          WUU_DEPLOY_TESTSERVER="$PWD/clients/native/.build/wuu-server" \
            bash clients/native/with-postgres.sh node --test deploy/remote/verify.test.mjs
      - name: Build deployment image
        run: docker build -f deploy/remote/Dockerfile -t wuu-remote:test .
