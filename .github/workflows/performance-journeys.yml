name: Performance journeys (diagnostic)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: performance-journeys-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    # Keep this bounded comparison on the ongoing performance PR. Ordinary PRs
    # retain their existing gates without two additional production builds.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/reduce-runtime-overhead'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_SHA: 0498ccf59c92ae97583623630348620bb6e8f2f5
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prepare exact baseline
        run: git worktree add --detach "$RUNNER_TEMP/wuu-performance-baseline" "$BASE_SHA"

      - name: Build both production applications sequentially
        id: builds
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for tree in "$RUNNER_TEMP/wuu-performance-baseline" "$GITHUB_WORKSPACE"; do
            npm ci --prefix "$tree/desktop"
            npm ci --prefix "$tree/clients/core"
            npm ci --prefix "$tree/clients/mobile-web"
            node "$tree/desktop/scripts/build-core.cjs"
            npm --prefix "$tree/desktop" run build
          done

      - name: Verify restored-history ownership under race detection
        run: >-
          go test -race ./internal/appserver
          -run '^(TestPersistedThreadLoadPreservesActiveTranscript|TestEditedBranchSurvivesReloadAndFork|TestFreshContextRecoverySurvivesTurnAndReload|TestServerThreadFork|TestHistoryPagesSurviveAppendsAndRejectRemovedBoundary|TestResumeResponseOnlyRetainsHistoryWithoutBroadcast)'
          -count=1 -timeout=5m

      - name: Retain minimal application builds
        if: ${{ always() && steps.builds.outcome == 'success' }}
        shell: bash
        run: |
          builds="$RUNNER_TEMP/wuu-performance-builds"
          mkdir -p "$builds"
          for variant in baseline candidate; do
            tree="$GITHUB_WORKSPACE"
            if [ "$variant" = baseline ]; then tree="$RUNNER_TEMP/wuu-performance-baseline"; fi
            tar -C "$tree" -czf "$builds/$variant-app.tar.gz" desktop/out desktop/build/bin
            python3 - "$tree" "$builds/$variant-manifest.json" "$variant" <<'PYTHON'
          import hashlib, json, pathlib, subprocess, sys
          root, output, variant = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
          paths = [root/'desktop/package-lock.json', root/'go.mod', root/'go.sum']
          paths += sorted(path for path in (root/'desktop/build/bin').iterdir() if path.is_file())
          paths += sorted(path for path in (root/'desktop/out').rglob('*') if path.is_file())
          manifest = {
              'variant': variant,
              'sourceCommit': subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip(),
              'sourceTree': subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'sha256': {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest() for path in paths},
              'scope': 'Diagnostic application bundles only; dependencies, caches and runtime profiles are excluded.',
          }
          output.write_text(json.dumps(manifest, indent=2))
          PYTHON
          done

      - name: Upload baseline application build
        if: ${{ always() && steps.builds.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-build-baseline
          retention-days: 7
          compression-level: 0
          path: ${{ runner.temp }}/wuu-performance-builds/baseline-*

      - name: Upload candidate application build
        if: ${{ always() && steps.builds.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-build-candidate
          retention-days: 7
          compression-level: 0
          path: ${{ runner.temp }}/wuu-performance-builds/candidate-*

      - name: Compare fresh-process conversation restoration
        if: ${{ always() && steps.builds.outcome == 'success' }}
        shell: bash
        run: |
          run_startup() {
            variant="$1"; label="$2"; turns="$3"; sidebar="$4"
            tree="$GITHUB_WORKSPACE"
            if [ "$variant" = baseline ]; then tree="$RUNNER_TEMP/wuu-performance-baseline"; fi
            fixture="$RUNNER_TEMP/wuu-startup-$variant-$label"
            output="$RUNNER_TEMP/wuu-performance-evidence/startup-$variant-$label"
            mkdir -p "$output"
            # Seed every trial with the same baseline core, outside the launch clock.
            WUU_STARTUP_PREPARE_ONLY=1 WUU_STARTUP_PREPARE_DIR="$fixture" \
            WUU_SWITCH_TURNS="$turns" WUU_SWITCH_SIDEBAR_THREADS="$sidebar" \
            WUU_DESKTOP_CORE="$RUNNER_TEMP/wuu-performance-baseline/desktop/build/bin/wuu-core" \
              desktop/node_modules/.bin/electron --no-sandbox --ozone-platform=headless \
              desktop/scripts/session-switch-e2e.cjs >"$output/prepare.log" 2>&1
            # Resolve every normal bundled helper from the selected exact source.
            for helper in "$tree"/desktop/build/bin/wuu-*-plugin; do
              name="$(basename "$helper" | sed 's/^wuu-//;s/-plugin$//;y/abcdefghijklmnopqrstuvwxyz-/ABCDEFGHIJKLMNOPQRSTUVWXYZ_/')"
              export "WUU_${name}_PLUGIN_HELPER=$helper"
            done
            WUU_SOURCE_ROOT="$tree" WUU_SWITCH_SAFE_MODE=0 \
            WUU_SWITCH_MAIN="$tree/desktop/out/main/index.js" \
            WUU_DESKTOP_CORE="$tree/desktop/build/bin/wuu-core" \
            WUU_SWITCH_BUILD_COMMIT="$(git -C "$tree" rev-parse HEAD)" \
            WUU_SWITCH_CORE_BUILD_COMMIT="$(git -C "$tree" rev-parse HEAD)" \
            WUU_SWITCH_BUILD_KIND=production-vite \
              node desktop/scripts/startup-e2e.cjs "$fixture" "$output"
          }
          # Exclude the first pair from measured repetitions; no OS cache flushing.
          for variant in baseline candidate; do run_startup "$variant" warmup 3000 1500; done
          repetition=0
          for order in "baseline candidate" "candidate baseline" "baseline candidate"; do
            repetition=$((repetition + 1))
            for variant in $order; do run_startup "$variant" "$repetition" 3000 1500; done
          done
          # A smaller configured history is a separate functional control.
          for variant in baseline candidate; do run_startup "$variant" small 20 0; done

      - name: Measure panel style work
        if: ${{ always() && steps.builds.outcome == 'success' }}
        shell: bash
        run: |
          run_panels() {
            variant="$1"; label="$2"
            tree="$GITHUB_WORKSPACE"
            if [ "$variant" = baseline ]; then tree="$RUNNER_TEMP/wuu-performance-baseline"; fi
            output="$RUNNER_TEMP/wuu-performance-evidence/panels-$variant-$label"
            mkdir -p "$output"
            WUU_RESIZE_DIAGNOSTIC=panels WUU_E2E_RENDERER="$tree/desktop/out/renderer/index.html" \
            WUU_RESIZE_OUTPUT="$output/results.json" \
              xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox \
              desktop/scripts/resize-live-layout-e2e.cjs 2>&1 | tee "$output/run.log"
          }
          for variant in baseline candidate; do run_panels "$variant" warmup; done
          repetition=0
          for order in "baseline candidate" "candidate baseline" "baseline candidate"; do
            repetition=$((repetition + 1))
            for variant in $order; do run_panels "$variant" "$repetition"; done
          done

      - name: Compare live resize layout
        if: ${{ always() && steps.builds.outcome == 'success' }}
        shell: bash
        run: |
          status=0
          for variant in baseline candidate; do
            tree="$GITHUB_WORKSPACE"
            if [ "$variant" = baseline ]; then tree="$RUNNER_TEMP/wuu-performance-baseline"; fi
            output="$RUNNER_TEMP/wuu-performance-evidence/resize-$variant"
            mkdir -p "$output"
            compare=""
            if [ "$variant" = candidate ]; then compare="$RUNNER_TEMP/wuu-performance-evidence/resize-baseline/results.json"; fi
            if ! WUU_E2E_RENDERER="$tree/desktop/out/renderer/index.html" \
                 WUU_RESIZE_OUTPUT="$output/results.json" WUU_RESIZE_COMPARE="$compare" \
                 xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox \
                 desktop/scripts/resize-live-layout-e2e.cjs 2>&1 | tee "$output/run.log"; then
              status=1
            fi
          done
          exit "$status"

      - name: Upload synthetic measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-journey-comparison
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/wuu-performance-evidence/**/*.json
            ${{ runner.temp }}/wuu-performance-evidence/**/*.md
            ${{ runner.temp }}/wuu-performance-evidence/**/*.png
            ${{ runner.temp }}/wuu-performance-evidence/**/*.log
