name: Frame scheduling diagnostic

on:
  workflow_dispatch:
  push:
    branches: [perf/ci-frame-scheduling-20261001]
    paths:
      - desktop/scripts/frame-scheduling-diagnostic.cjs
      - desktop/scripts/image-layout-e2e.cjs
      - .github/workflows/frame-scheduling-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: frame-scheduling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Compare native window visibility
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked Electron dependencies
        run: npm ci --prefix desktop

      - name: Record hidden and shown frame scheduling
        shell: bash
        env:
          WUU_FRAME_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/wuu-frame-scheduling
        run: |
          mkdir -p "$WUU_FRAME_DIAGNOSTIC_OUTPUT"
          export WUU_FRAME_DIAGNOSTIC_COMMIT="$(git rev-parse HEAD)"
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/frame-scheduling-diagnostic.cjs 2>&1 | tee "$WUU_FRAME_DIAGNOSTIC_OUTPUT/run.log"

      - name: Build the production renderer once
        timeout-minutes: 3
        run: cd desktop && ./node_modules/.bin/electron-vite build

      - name: Trace one real image-layout scenario in ABBA order
        timeout-minutes: 4
        shell: bash
        env:
          WUU_IMAGE_LAYOUT_DIAGNOSTIC: "1"
          WUU_IMAGE_LAYOUT_CASE: markdown-table-history-1-1180
        run: |
          export WUU_FRAME_DIAGNOSTIC_COMMIT="$(git rev-parse HEAD)"
          mkdir -p "${{ runner.temp }}/wuu-image-scheduling"
          find desktop/out/renderer -type f -print0 | sort -z | xargs -0 sha256sum > "${{ runner.temp }}/wuu-image-scheduling/renderer-hashes.txt"
          for condition in hidden-1 shown-1 shown-2 hidden-2; do
            export WUU_E2E_HIDDEN=false
            if [[ "$condition" == hidden-* ]]; then export WUU_E2E_HIDDEN=true; fi
            export WUU_IMAGE_LAYOUT_OUTPUT="${{ runner.temp }}/wuu-image-scheduling/$condition"
            mkdir -p "$WUU_IMAGE_LAYOUT_OUTPUT"
            xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/image-layout-e2e.cjs 2>&1 | tee "$WUU_IMAGE_LAYOUT_OUTPUT/run.log"
          done

      - name: Upload real-App scheduling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scheduling-evidence
          path: |
            ${{ runner.temp }}/wuu-image-scheduling/**/*.json
            ${{ runner.temp }}/wuu-image-scheduling/**/*.log
            ${{ runner.temp }}/wuu-image-scheduling/**/*.txt
            ${{ runner.temp }}/wuu-image-scheduling/**/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload frame scheduling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-scheduling-evidence
          path: |
            ${{ runner.temp }}/wuu-frame-scheduling/*.json
            ${{ runner.temp }}/wuu-frame-scheduling/*.log
            ${{ runner.temp }}/wuu-frame-scheduling/*.txt
          retention-days: 14
          if-no-files-found: ignore
