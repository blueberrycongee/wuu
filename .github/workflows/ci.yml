name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.select.outputs.go }}
      desktop: ${{ steps.select.outputs.desktop }}
      desktop_suites: ${{ steps.select.outputs.desktop_suites }}
      desktop_related: ${{ steps.select.outputs.desktop_related }}
      clients: ${{ steps.select.outputs.clients }}
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Select jobs from the complete change
        id: select
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: |
          # Selection compares two trees, not history. Fetch the exact base even
          # when a push spans several commits; failures must not skip checks.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$CI_BASE" ] && ! [[ "$CI_BASE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$CI_BASE"
          fi
          node .github/scripts/select-ci.mjs

  repository-check:
    name: Repository check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify CI selection contracts
        run: node --test .github/scripts/select-ci.test.mjs

      - name: Check repository metadata
        run: make repository-check

  go-validation:
    name: Go validation
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      WUU_TEST_DATABASE_URL: postgres://wuu:wuu_test@127.0.0.1:5432/wuu_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: wuu
          POSTGRES_PASSWORD: wuu_test
          POSTGRES_DB: wuu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wuu -d wuu_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install plugin build dependencies
        run: npm ci --prefix plugins

      - name: Check
        run: make check-go check-plugins

      - name: Test
        run: make test-go test-plugins

      - name: Build plugin model acceptance prerequisites
        run: |
          npm ci --prefix packages/plugin-sdk
          npm --prefix packages/plugin-sdk run build
          mkdir -p .tmp/bin
          go build -o .tmp/bin/wuu ./cmd/wuu

      - name: Guard one-shot plugin model requests
        timeout-minutes: 3
        shell: bash
        env:
          WUU_E2E_CORE: ${{ github.workspace }}/.tmp/bin/wuu
          WUU_MODEL_E2E_OUTPUT: ${{ runner.temp }}/wuu-plugin-model-evidence
        run: |
          mkdir -p "$WUU_MODEL_E2E_OUTPUT"
          set -o pipefail
          node scripts/plugin-model-request-e2e.mjs 2>&1 | tee "$WUU_MODEL_E2E_OUTPUT/run.log"

      - name: Upload one-shot plugin model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-model-request-evidence
          path: |
            ${{ runner.temp }}/wuu-plugin-model-evidence/*.json
            ${{ runner.temp }}/wuu-plugin-model-evidence/*.jsonl
            ${{ runner.temp }}/wuu-plugin-model-evidence/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard extensible model pipeline journeys
        timeout-minutes: 4
        shell: bash
        env:
          WUU_E2E_CORE: ${{ github.workspace }}/.tmp/bin/wuu
          WUU_PIPELINE_E2E_OUTPUT: ${{ runner.temp }}/wuu-plugin-pipeline-evidence
        run: |
          mkdir -p "$WUU_PIPELINE_E2E_OUTPUT"
          set -o pipefail
          packages/plugin-sdk/node_modules/.bin/tsc -p scripts/fixtures/model-pipeline/tsconfig.json
          node scripts/plugin-model-pipeline-e2e.mjs 2>&1 | tee "$WUU_PIPELINE_E2E_OUTPUT/run.log"

      - name: Upload extensible model pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-model-pipeline-evidence
          path: |
            ${{ runner.temp }}/wuu-plugin-pipeline-evidence/*.json
            ${{ runner.temp }}/wuu-plugin-pipeline-evidence/*.jsonl
            ${{ runner.temp }}/wuu-plugin-pipeline-evidence/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: make build-go

      - name: Verify live plugin generation replacement
        env:
          WUU_SELF_EXTENSION_EVIDENCE: ${{ runner.temp }}/wuu-plugin-generation-evidence
        run: WUU_SELF_EXTENSION_BINARY="$PWD/bin/wuu" go test -count=1 -run '^TestAgentSelfExtensionProcess$' ./cmd/wuu

      - name: Upload plugin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-runtime-evidence
          path: |
            .tmp/e2e/bundled-plugins/
            ${{ runner.temp }}/wuu-plugin-generation-evidence/
          if-no-files-found: ignore
          retention-days: 14

  project-agent-check:
    name: Project Agent check
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      WUU_TEST_DATABASE_URL: postgres://wuu:wuu_test@127.0.0.1:5432/wuu_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: wuu
          POSTGRES_PASSWORD: wuu_test
          POSTGRES_DB: wuu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wuu -d wuu_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Test experimental Project Agent
        # Keep the entire suite: this tag changes shared recovery and lifecycle paths.
        run: go test -tags project_agent ./internal/appserver

  go-check:
    name: Go check
    runs-on: ubuntu-latest
    needs: [changes, go-validation, project-agent-check]
    if: always()
    steps:
      - name: Require selected Go suites
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          GO_REQUIRED: ${{ needs.changes.outputs.go }}
          GO_VALIDATION_RESULT: ${{ needs.go-validation.result }}
          PROJECT_AGENT_RESULT: ${{ needs.project-agent-check.result }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$GO_REQUIRED" = true ]; then
            test "$GO_VALIDATION_RESULT" = success
            test "$PROJECT_AGENT_RESULT" = success
          else
            test "$GO_VALIDATION_RESULT" = skipped
            test "$PROJECT_AGENT_RESULT" = skipped
          fi

  desktop-suite:
    name: Desktop / ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.desktop_suites) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: |
          npm ci --prefix desktop
          # Electron downloads lazily on require; parallel Vitest workers must
          # not extract into the same dist directory at the same time.
          node desktop/node_modules/electron/install.js
          node -e 'require("./desktop/node_modules/electron")'

      - name: Typecheck
        if: ${{ matrix.suite == 'unit' }}
        run: make check-desktop

      - name: Guard development renderer recovery
        if: ${{ matrix.suite == 'unit' }}
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/wuu-renderer-recovery-evidence"
          set -o pipefail
          xvfb-run --auto-servernum npm --prefix desktop run test:renderer-recovery -- --no-sandbox 2>&1 | tee "${{ runner.temp }}/wuu-renderer-recovery-evidence/run.log"

      - name: Upload renderer recovery evidence
        if: ${{ matrix.suite == 'unit' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: renderer-recovery-evidence
          path: ${{ runner.temp }}/wuu-renderer-recovery-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        # Source-based unit tests and renderer recovery do not consume a bundle.
        if: ${{ matrix.suite != 'unit' }}
        id: build-renderer
        shell: bash
        run: |
          # These fixtures keep phone access disabled. Clients check builds the
          # Web shell; macOS/Windows packaging still builds its bundled copy.
          (cd desktop && node_modules/.bin/electron-vite build)
          find desktop/out/renderer -type f -print0 | sort -z | xargs -0 sha256sum > "${{ runner.temp }}/wuu-initial-renderer.sha256"

      - name: Install fonts for multilingual selection captures
        if: ${{ matrix.suite != 'unit' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji xdotool

      - name: Capture sidebar surface review
        # Before/after review evidence is scoped to this visual-change branch.
        if: ${{ matrix.suite == 'shell' && (!cancelled() && steps.build-renderer.outcome == 'success' && github.head_ref == 'fix/sidebar-selection-insets') }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          output="${{ runner.temp }}/wuu-sidebar-surface-evidence"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/source-commit.txt"
          (cd desktop && node_modules/.bin/vite --config dev/sidebar-accessories/vite.config.ts) > "$output/vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5208/dev/sidebar-accessories/ > /dev/null; then break; fi
            kill -0 "$vite_pid"
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:5208/dev/sidebar-accessories/ > /dev/null
          for variant in before after; do
            baseline=0
            if [ "$variant" = before ]; then baseline=1; fi
            WUU_SIDEBAR_BASELINE="$baseline" WUU_SIDEBAR_OUTPUT="$output/$variant" \
              xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/dev/sidebar-accessories/capture.cjs 2>&1 | tee "$output/$variant.log"
          done
          python3 - "$output" <<'PYTHON'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          before = json.loads((root / "before/geometry.json").read_text())["report"]
          after = json.loads((root / "after/geometry.json").read_text())["report"]
          for name, states in before.items():
              for state, measurement in states.items():
                  for old, new in zip(measurement["rows"], after[name][state]["rows"], strict=True):
                      assert new["bounds"]["width"] < old["bounds"]["width"], (name, state, "surface did not narrow")
                      for key in ("x", "width", "height"):
                          assert abs(new["title"][key] - old["title"][key]) < 0.1, (name, state, key, "title geometry changed")
          print("PASS: before/after surfaces narrow while title geometry stays fixed")
          PYTHON
          WUU_SIDEBAR_FULL_CAPTURE=1 WUU_SCROLL_FADE_OUTPUT="$output/full" \
            xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/sidebar-scroll-fade-e2e.cjs 2>&1 | tee "$output/full.log"

      - name: Upload sidebar surface evidence
        if: ${{ matrix.suite == 'shell' && (always() && github.head_ref == 'fix/sidebar-selection-insets') }}
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-surface-evidence
          path: ${{ runner.temp }}/wuu-sidebar-surface-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify onboarding scroll-edge fades
        if: ${{ matrix.suite == 'shell' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 3
        shell: bash
        env:
          WUU_SCROLL_FADE_ONBOARDING: "1"
          WUU_SCROLL_FADE_OUTPUT: ${{ runner.temp }}/wuu-onboarding-scroll-evidence
        run: |
          mkdir -p "$WUU_SCROLL_FADE_OUTPUT"
          set -o pipefail
          (cd desktop && node_modules/.bin/electron-vite build --config dev/onboarding/electron.vite.config.ts --ignoreConfigWarning)
          xvfb-run --auto-servernum --server-args='-screen 0 1800x1800x24' desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/sidebar-scroll-fade-e2e.cjs 2>&1 | tee "$WUU_SCROLL_FADE_OUTPUT/run.log"

      - name: Upload onboarding scroll evidence
        if: ${{ matrix.suite == 'shell' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-scroll-evidence
          path: ${{ runner.temp }}/wuu-onboarding-scroll-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard sidebar and streaming scroll-edge fades
        if: ${{ matrix.suite == 'shell' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 3
        shell: bash
        env:
          WUU_SCROLL_FADE_OUTPUT: ${{ runner.temp }}/wuu-sidebar-scroll-fade-evidence
        run: |
          mkdir -p "$WUU_SCROLL_FADE_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/sidebar-scroll-fade-e2e.cjs 2>&1 | tee "$WUU_SCROLL_FADE_OUTPUT/run.log"

      - name: Upload sidebar scroll fade evidence
        if: ${{ matrix.suite == 'shell' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-scroll-fade-evidence
          path: ${{ runner.temp }}/wuu-sidebar-scroll-fade-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard streamed reply settlement layout
        if: ${{ matrix.suite == 'layout' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 4
        shell: bash
        env:
          WUU_SETTLEMENT_OUTPUT: ${{ runner.temp }}/wuu-stream-settlement-evidence
        run: |
          mkdir -p "$WUU_SETTLEMENT_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum npm --prefix desktop run test:e2e:stream-settlement -- --no-sandbox 2>&1 | tee "$WUU_SETTLEMENT_OUTPUT/run.log"

      - name: Upload streamed reply settlement evidence
        if: ${{ matrix.suite == 'layout' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: stream-settlement-evidence
          path: ${{ runner.temp }}/wuu-stream-settlement-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard composer inline extension foundation
        if: ${{ matrix.suite == 'shell' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 3
        shell: bash
        env:
          WUU_INLINE_E2E_OUTPUT: ${{ runner.temp }}/wuu-composer-inline-evidence
        run: |
          mkdir -p "$WUU_INLINE_E2E_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/composer-inline-e2e.cjs 2>&1 | tee "$WUU_INLINE_E2E_OUTPUT/run.log"

      - name: Upload composer inline extension evidence
        if: ${{ matrix.suite == 'shell' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: composer-inline-extension-evidence
          path: ${{ runner.temp }}/wuu-composer-inline-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard disabled app snapshots and system permissions
        if: ${{ matrix.suite == 'shell' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p desktop/out/app-context-e2e
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/app-context-e2e.cjs 2>&1 | tee desktop/out/app-context-e2e/run.log

      - name: Upload app snapshot renderer evidence
        if: ${{ matrix.suite == 'shell' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: app-snapshot-renderer-evidence
          path: |
            desktop/out/app-context-e2e/*.png
            desktop/out/app-context-e2e/*.json
            desktop/out/app-context-e2e/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard workspace tabs and navigation
        if: ${{ matrix.suite == 'shell' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p desktop/out/workspace-new-tab-e2e
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/workspace-new-tab-e2e.cjs 2>&1 | tee desktop/out/workspace-new-tab-e2e/run.log

      - name: Upload workspace tab evidence
        if: ${{ matrix.suite == 'shell' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-tab-evidence
          path: |
            desktop/out/workspace-new-tab-e2e/*.png
            desktop/out/workspace-new-tab-e2e/*.json
            desktop/out/workspace-new-tab-e2e/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard titlebar alignment and sidebar hit targets
        if: ${{ matrix.suite == 'shell' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p desktop/out/e2e/settings-titlebar
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/settings-sidebar-hit-e2e.cjs 2>&1 | tee desktop/out/e2e/settings-titlebar/run.log

      - name: Upload titlebar alignment evidence
        if: ${{ matrix.suite == 'shell' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: titlebar-alignment-evidence
          path: |
            desktop/out/e2e/settings-titlebar/*.png
            desktop/out/e2e/settings-titlebar/*.json
            desktop/out/e2e/settings-titlebar/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard file selections and side-chat chips
        if: ${{ matrix.suite == 'selection' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 5
        shell: bash
        env:
          WUU_E2E_VISIBLE: "true"
          WUU_E2E_OUTPUT: ${{ runner.temp }}/wuu-file-selection-evidence
        run: |
          mkdir -p "$WUU_E2E_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/file-selection-e2e.cjs 2>&1 | tee "$WUU_E2E_OUTPUT/run.log"

      - name: Guard response selections and native comment focus
        if: ${{ matrix.suite == 'selection' && (!cancelled() && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 3
        shell: bash
        env:
          WUU_E2E_VISIBLE: "true"
          WUU_SELECTION_E2E_OUTPUT: ${{ runner.temp }}/wuu-response-selection-evidence
        run: |
          mkdir -p "$WUU_SELECTION_E2E_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/response-selection-e2e.cjs 2>&1 | tee "$WUU_SELECTION_E2E_OUTPUT/run.log"

      - name: Upload selection visual evidence
        if: ${{ matrix.suite == 'selection' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: selection-visual-evidence
          path: |
            ${{ runner.temp }}/wuu-file-selection-evidence/*.png
            ${{ runner.temp }}/wuu-file-selection-evidence/*.json
            ${{ runner.temp }}/wuu-file-selection-evidence/*.log
            ${{ runner.temp }}/wuu-response-selection-evidence/*.png
            ${{ runner.temp }}/wuu-response-selection-evidence/*.json
            ${{ runner.temp }}/wuu-response-selection-evidence/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard titlebar rename interactions
        if: ${{ matrix.suite == 'shell' }}
        timeout-minutes: 3
        env:
          WUU_TITLEBAR_OUTPUT: ${{ runner.temp }}/wuu-titlebar-evidence
        run: |
          mkdir -p "$WUU_TITLEBAR_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/titlebar-rename-e2e.cjs 2>&1 | tee "$WUU_TITLEBAR_OUTPUT/run.log"

      - name: Upload titlebar rename evidence
        if: ${{ matrix.suite == 'shell' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: titlebar-rename-evidence
          path: |
            ${{ runner.temp }}/wuu-titlebar-evidence/*.json
            ${{ runner.temp }}/wuu-titlebar-evidence/*.png
            ${{ runner.temp }}/wuu-titlebar-evidence/*.log
            ${{ runner.temp }}/wuu-titlebar-evidence/*.txt
          retention-days: 14

      - name: Guard image inspection aggregation
        if: ${{ matrix.suite == 'layout' }}
        timeout-minutes: 3
        shell: bash
        env:
          WUU_ARTIFACT_E2E_ONLY: inspection
          WUU_ARTIFACT_OUTPUT: ${{ runner.temp }}/wuu-image-inspection-evidence
        run: |
          mkdir -p "$WUU_ARTIFACT_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/artifact-preview-e2e.cjs 2>&1 | tee "$WUU_ARTIFACT_OUTPUT/run.log"

      - name: Upload image inspection evidence
        if: ${{ matrix.suite == 'layout' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: image-inspection-evidence
          path: |
            ${{ runner.temp }}/wuu-image-inspection-evidence/*.json
            ${{ runner.temp }}/wuu-image-inspection-evidence/*.png
            ${{ runner.temp }}/wuu-image-inspection-evidence/*.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/setup-go@v5
        if: ${{ contains(fromJSON('["corpus","session","shell"]'), matrix.suite) }}
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build desktop fixture core
        if: ${{ contains(fromJSON('["corpus","session"]'), matrix.suite) }}
        id: build-fixture-core
        run: go build -o "${{ runner.temp }}/wuu-session-switch-core" ./cmd/wuu

      - name: Validate shareable conversation corpus
        if: ${{ matrix.suite == 'corpus' }}
        run: npm --prefix desktop run test:corpus

      - name: Replay conversation corpus through desktop and core
        if: ${{ matrix.suite == 'corpus' && (!cancelled() && steps.build-fixture-core.outcome == 'success' && steps.build-renderer.outcome == 'success') }}
        timeout-minutes: 12
        shell: bash
        env:
          WUU_CORPUS_SKIP_BUILD: '1'
          WUU_TOUR_CORE: ${{ runner.temp }}/wuu-session-switch-core
          WUU_TOUR_OUTPUT: ${{ runner.temp }}/wuu-conversation-corpus
        run: |
          mkdir -p "$WUU_TOUR_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum npm --prefix desktop run test:e2e:conversation-corpus -- --no-sandbox 2>&1 | tee "$WUU_TOUR_OUTPUT/run.log"
          mkdir -p "$WUU_TOUR_OUTPUT/text-only"
          WUU_CORPUS_TEXT_ONLY=1 WUU_TOUR_ONLY=sample-02 WUU_TOUR_OUTPUT="$WUU_TOUR_OUTPUT/text-only" \
            xvfb-run --auto-servernum npm --prefix desktop run test:e2e:conversation-corpus -- --no-sandbox 2>&1 | tee "$WUU_TOUR_OUTPUT/text-only/run.log"

      - name: Upload conversation corpus acceptance evidence
