  desktop-check:
    name: Desktop check
    needs: [changes, desktop-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected Desktop suite
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          SUITES_RESULT: ${{ needs.desktop-suite.result }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$DESKTOP_REQUIRED" = true ]; then
            test "$SUITES_RESULT" = success
          else
            test "$SUITES_RESULT" = skipped
          fi

  clients-check:
    name: Clients check
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile/package-lock.json
            clients/mobile-web/package-lock.json
            packages/plugin-sdk/package-lock.json
            plugins/package-lock.json
            packages/protocol/package-lock.json

      - name: Install dependencies
        # mobile-web imports renderer sources whose dependencies live in desktop.
        run: |
          pids=()
          for workspace in \
            desktop \
            clients/core \
            clients/mobile \
            clients/mobile-web \
            packages/plugin-sdk \
            plugins \
            packages/protocol; do
            npm ci --prefix "$workspace" &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Check
        run: make check-clients check-plugins

      - name: Test
        run: make test-clients

      - name: Build
        run: make build-clients

      - name: Build headless workspace acceptance prerequisites
        run: |
          npm --prefix desktop run build:remote
          clients/mobile-web/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y openssh-server

      - name: Verify SSH workspace lifecycle
        timeout-minutes: 6
        shell: bash
        env:
          WUU_HEADLESS_E2E_OUTPUT: ${{ github.workspace }}/.tmp/e2e/headless-workspace
        run: |
          mkdir -p "$WUU_HEADLESS_E2E_OUTPUT"
          set -o pipefail
          npm --prefix clients/mobile-web run test:headless 2>&1 | tee "$WUU_HEADLESS_E2E_OUTPUT/run.log"

      - name: Upload SSH workspace acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-workspace-evidence
          path: .tmp/e2e/headless-workspace/
          if-no-files-found: ignore
          retention-days: 14

  macos-check:
    name: macOS native check
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checkout is GitHub's synthetic merge. Its first parent is the
          # base tree, so this compares the complete PR rather than its last commit.
          fetch-depth: 2

      - name: Select native packaging validation
        id: native-packaging
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- desktop/native desktop/package.json desktop/package-lock.json desktop/scripts desktop/electron.vite.config.ts .github/scripts/select-ci.mjs .github/workflows/ci.yml; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json

      - name: Install
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js
          node -e 'require("electron")'

      - name: Test macOS process sandbox
        if: github.event_name != 'push'
        run: go test ./internal/processsandbox -count=1

      - name: Test macOS PTY lifecycle
        if: github.event_name != 'push'
        run: go test ./internal/process -run '^Test(PTY|ManagerTTY|StartTTY|WriteStdinToTTY)' -count=1

      - name: Test macOS release signing fixtures
        if: github.event_name != 'push'
        run: |
          npm --prefix desktop run test:release-signing
          node --test desktop/scripts/test-notarization.cjs desktop/scripts/test-release-checkpoint.cjs desktop/scripts/test-update-metadata.cjs

      - name: Build read-only app snapshot helper
        if: github.event_name != 'push'
        run: |
          npm --prefix desktop run build:app-context-mac
          "desktop/build/app-context/Wuu App Snapshot.app/Contents/MacOS/wuu-app-context" --status
          ELECTRON_RUN_AS_NODE=1 desktop/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron -e 'if (typeof require(process.cwd() + "/desktop/build/app-context/capture-target.node").pinTarget !== "function") process.exit(1)'

      - name: Test native helper
        if: github.event_name != 'push'
        run: make test-native

      - name: Install phone Web dependencies
        if: steps.native-packaging.outputs.required == 'true'
        run: |
          npm ci --prefix clients/core
          npm ci --prefix clients/mobile-web

      - name: Install plugin build dependencies
        if: steps.native-packaging.outputs.required == 'true'
        run: npm ci --prefix plugins

      - name: Package macOS app
        if: steps.native-packaging.outputs.required == 'true'
        # Validate the release resource layout with ad-hoc signatures on native PRs.
        run: make build-macos

      - name: Ad-hoc sign and verify packaged native resources
        if: steps.native-packaging.outputs.required == 'true'
        env:
          # PR packaging skips electron-builder's signing hook. Explicitly use
          # the existing certificate-free signer, never a CI signing identity.
          WUU_RELEASE_SIGN_ID: ""
          WUU_RELEASE_KEYCHAIN: ""
        run: |
          node - <<'NODE'
          const { readdirSync, existsSync } = require("node:fs");
          const { join } = require("node:path");
          const { execFileSync } = require("node:child_process");
          const bundles = readdirSync("desktop/release", { withFileTypes: true })
            .filter(entry => entry.isDirectory() && entry.name.startsWith("mac"))
            .map(entry => join("desktop/release", entry.name, "wuu.app"))
            .filter(path => existsSync(path));
          if (bundles.length !== 1) throw new Error(`Expected one packaged macOS app, found ${bundles.length}`);
          (async () => {
            await require("./desktop/scripts/sign-mac.cjs")({
              app: bundles[0], platform: "darwin",
              version: require("./desktop/node_modules/electron/package.json").version,
            });
            execFileSync(process.execPath, ["desktop/scripts/verify-mac-release.cjs", bundles[0]], { stdio: "inherit" });
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

  linux-check:
    name: Linux package check
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # AppImage needs user namespaces; stock Ubuntu 24.04 restricts them.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      VITE_ENABLE_ACCOUNT: "false"
      VITE_ENABLE_REMOTE_CONTROL: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
          npm ci --prefix desktop
          npm ci --prefix plugins
          npm ci --prefix clients/core
          npm ci --prefix clients/mobile-web
          node desktop/node_modules/electron/install.js
      - name: Require a working Linux filesystem sandbox
        run: |
          go test -json ./internal/processsandbox -run '^TestLinuxFilesystemBoundary$' -count=1 > "$RUNNER_TEMP/linux-sandbox.json"
          node -e 'const e=require("fs").readFileSync(require("path").join(process.env.RUNNER_TEMP,"linux-sandbox.json"),"utf8").trim().split("\n").map(JSON.parse); const cases=e.filter(x=>x.Test?.startsWith("TestLinuxFilesystemBoundary/") && x.Action==="pass"); if(e.some(x=>x.Action==="skip") || cases.length!==5) throw Error("Linux packaging requires all five Landlock boundary cases, with no skips")'
      - name: Build and verify Linux packages
        run: npm --prefix desktop run release:linux
      - name: Launch extracted packages with sandboxing
        run: xvfb-run --auto-servernum npm --prefix desktop run test:e2e:linux-package
      - name: Preserve Linux package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-evidence
          path: |
            desktop/release/linux-package-evidence/
            desktop/release/verification-linux.json
            ${{ runner.temp }}/linux-sandbox.json
          if-no-files-found: ignore
          retention-days: 14

  windows-check:
    name: Windows native check
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json

      # The full Go suite includes Unix permission, shell, and file-lifecycle
      # contracts. Keep this job focused on the Windows-native boundaries it can
      # validate rather than turning expected POSIX differences into a red gate.
      - name: Test Windows-native runtime boundaries
        if: github.event_name != 'push'
        run: |
          go test ./internal/process -run '^Test(VerifyProcessGroupRejectsMismatchedRecords|LookupProcessGroupIsPid|PTYUnsupported|TaskkillTreeIgnoresInvalidPids|ProcessExistsSelf)$'
          go test ./internal/mcp -run '^TestStdioTransportCloseTerminatesWindowsDescendants$' -count=1
          go test ./internal/session -run '^TestInferenceRuntimeProcessAliveWindows$'
          go test ./internal/tools -run '^TestProcessSandbox(PolicyMapsWorkspaceBoundary|TempRejectsSymlink|PolicyFailsClosedWithoutBackend)$'

      - name: Test Windows plugin generation leases
        if: github.event_name != 'push'
        run: go test ./internal/session -run '^Test(PluginGenerationLease|ReadPluginGenerationEpoch|PluginCatalogMutation|PluginCatalogReadLease)' -count=1 -v

      - name: Install Desktop dependencies
        run: npm ci --prefix desktop

      - name: Typecheck Desktop on Windows
        if: github.event_name != 'push'
        run: npm --prefix desktop run typecheck

      - name: Install phone Web dependencies
        if: github.event_name != 'pull_request'
        run: |
          npm ci --prefix clients/core
          npm ci --prefix clients/mobile-web

      - name: Install plugin build dependencies
        if: github.event_name != 'pull_request'
        run: npm ci --prefix plugins

      - name: Package unpacked Windows app
        if: github.event_name != 'pull_request'
        run: npm --prefix desktop run pack:win

  ci-check:
    name: CI check
    runs-on: ubuntu-latest
    needs: [changes, repository-check, go-check, desktop-check, clients-check, macos-check, linux-check, windows-check]
    if: always()
    steps:
      - name: Require successful selection and all selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          selected = needs['changes']['outputs']
          expected = {
              'changes': True,
              'repository-check': os.environ['EVENT'] != 'push',
              'go-check': True,
              'desktop-check': True,
              'clients-check': selected.get('clients') == 'true',
              'macos-check': selected.get('native') == 'true',
              'windows-check': selected.get('native') == 'true',
              'linux-check': selected.get('native') == 'true',
          }
          for job, required in expected.items():
              result = needs[job]['result']
              wanted = 'success' if required else 'skipped'
              if result != wanted:
                  raise SystemExit(f'{job}: expected {wanted}, got {result}')
          PYTHON
