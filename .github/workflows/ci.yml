name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.select.outputs.go }}
      architecture: ${{ steps.select.outputs.architecture }}
      desktop: ${{ steps.select.outputs.desktop }}
      desktop_suites: ${{ steps.select.outputs.desktop_suites }}
      desktop_e2e_suites: ${{ steps.select.outputs.desktop_e2e_suites }}
      desktop_related: ${{ steps.select.outputs.desktop_related }}
      clients: ${{ steps.select.outputs.clients }}
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Select jobs from the complete change
        id: select
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: |
          # Selection compares two trees, not history. Fetch the exact base even
          # when a push spans several commits; failures must not skip checks.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$CI_BASE" ] && ! [[ "$CI_BASE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$CI_BASE"
          fi
          node .github/scripts/select-ci.mjs

  repository-check:
    name: Repository check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify CI selection contracts
        run: node --test .github/scripts/select-ci.test.mjs .github/scripts/workflow-context.test.mjs .github/scripts/go-check-contract.test.mjs .github/scripts/mcp-auth-evidence.test.mjs

      # Reuse this already allocated runner instead of queueing another producer
      # after changes. Selection uses the same immutable base/head as changes.
      - name: Select shared Desktop build from the complete change
        id: select-build
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: |
          # Selection compares two trees, not history. Fetch the exact base even
          # when a push spans several commits; failures must not skip checks.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$CI_BASE" ] && ! [[ "$CI_BASE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$CI_BASE"
          fi
          node .github/scripts/select-ci.mjs

      - uses: actions/setup-node@v4
        id: build-node
        if: steps.select-build.outputs.desktop == 'true' && steps.select-build.outputs.desktop_suites != '["unit","unit-extra"]'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
      - name: Check repository and prepare selected Desktop build
        # Checks still run when selection/cache preparation fails. No background
        # process survives this step, and a failed check prevents the build/upload.
        if: ${{ !cancelled() }}
        env:
          BUILD_REQUIRED: ${{ steps.select-build.outputs.desktop == 'true' && steps.select-build.outputs.desktop_suites != '["unit","unit-extra"]' }}
          BUILD_SELECTION_RESULT: ${{ steps.select-build.outcome }}
          BUILD_NODE_RESULT: ${{ steps.build-node.outcome }}
        run: |
          (
            node --test .github/scripts/*.test.mjs
            make repository-check
          ) &
          pids=("$!")
          status=0
          if [ "$BUILD_SELECTION_RESULT" != success ]; then status=1; fi
          if [ "$BUILD_REQUIRED" = true ]; then
            if [ "$BUILD_NODE_RESULT" = success ]; then
              npm ci --prefix desktop --ignore-scripts &
              pids+=("$!")
              npm ci --prefix clients/core &
              pids+=("$!")
            else
              status=1
            fi
          fi
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - uses: actions/setup-go@v5
        if: steps.select-build.outputs.desktop == 'true' && steps.select-build.outputs.desktop_suites != '["unit","unit-extra"]' && (contains(steps.select-build.outputs.desktop_suites, 'corpus') || contains(steps.select-build.outputs.desktop_suites, 'session'))
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build this run's renderer and core once
        if: steps.select-build.outputs.desktop == 'true' && steps.select-build.outputs.desktop_suites != '["unit","unit-extra"]'
        run: |
          mkdir -p .tmp/desktop-ci-build
          git rev-parse HEAD > .tmp/desktop-ci-build/source-commit.txt
          (cd desktop && NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096" node_modules/.bin/electron-vite build) &
          renderer_pid=$!
          (
            if [[ '${{ steps.select-build.outputs.desktop_suites }}' == *corpus* || '${{ steps.select-build.outputs.desktop_suites }}' == *session* ]]; then
              fixture_version="$(make -s print-version)"
              go build -ldflags "-X github.com/blueberrycongee/wuu/internal/version.Version=${fixture_version}" -o .tmp/desktop-ci-build/wuu-session-switch-core ./cmd/wuu
              go build -o .tmp/desktop-ci-build/wuu-session-fixture ./scripts/session-fixture
            fi
          ) &
          core_pid=$!
          status=0
          wait "$renderer_pid" || status=1
          wait "$core_pid" || status=1
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          find desktop/out -type f -print0 | sort -z | xargs -0 sha256sum > .tmp/desktop-ci-build/bundle.sha256
          if [ -f .tmp/desktop-ci-build/wuu-session-switch-core ]; then
            sha256sum .tmp/desktop-ci-build/wuu-session-switch-core >> .tmp/desktop-ci-build/bundle.sha256
            sha256sum .tmp/desktop-ci-build/wuu-session-fixture >> .tmp/desktop-ci-build/bundle.sha256
          fi
          tar -cf "$RUNNER_TEMP/desktop-ci-build.tar" desktop/out .tmp/desktop-ci-build
      - uses: actions/upload-artifact@v4
        if: steps.select-build.outputs.desktop == 'true' && steps.select-build.outputs.desktop_suites != '["unit","unit-extra"]'
        with:
          name: desktop-ci-build
          path: ${{ runner.temp }}/desktop-ci-build.tar
          compression-level: 0
          retention-days: 1

  go-validation:
    name: Go validation / ${{ matrix.suite }}${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: check
          - suite: packages
          - suite: appserver
            shard: 0
          - suite: appserver
            shard: 1
          - suite: appserver
            shard: 2
          - suite: plugins
    env:
      WUU_TEST_DATABASE_URL: postgres://wuu:wuu_test@127.0.0.1:5432/wuu_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: wuu
          POSTGRES_PASSWORD: wuu_test
          POSTGRES_DB: wuu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wuu -d wuu_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install ripgrep for search tests
        if: matrix.suite == 'packages'
        run: |
          node desktop/scripts/fetch-ripgrep.cjs
          echo "$GITHUB_WORKSPACE/desktop/build/tools" >> "$GITHUB_PATH"

      - name: Install plugin and SDK dependencies
        run: |
          npm ci --prefix packages/plugin-sdk
          npm ci --prefix plugins

      - name: Check
        if: matrix.suite == 'check'
        run: make check-go check-plugins

      - name: Test all other Go packages
        if: matrix.suite == 'packages'
        env:
          WUU_GO_TIMING_EVIDENCE: ${{ runner.temp }}/go-package-timings
        run: node .github/scripts/go-test-timing.mjs

      - name: Upload Go package timing evidence
        if: always() && matrix.suite == 'packages'
        uses: actions/upload-artifact@v4
        with:
          name: go-package-timings
          path: ${{ runner.temp }}/go-package-timings/
          if-no-files-found: warn

      - name: Test appserver shard
        if: matrix.suite == 'appserver'
        env:
          WUU_GO_SHARD_EVIDENCE: ${{ runner.temp }}/go-shard/manifest.json
        run: node .github/scripts/go-test-shard.mjs ./internal/appserver ${{ matrix.shard }} 3

      - name: Upload appserver test inventory
        if: always() && matrix.suite == 'appserver'
        uses: actions/upload-artifact@v4
        with:
          name: go-appserver-${{ matrix.shard }}-inventory
          path: ${{ runner.temp }}/go-shard/manifest.json
          if-no-files-found: warn

      - name: Test plugins
        if: matrix.suite == 'plugins'
        run: make test-plugins

      - name: Guard single-file plugins under desktop CSP
        if: matrix.suite == 'plugins'
        run: |
          export CHROMIUM_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM_BIN"
          set -o pipefail
          go test ./internal/plugin -run '^TestPrepareSingleFileDesktopAndFullStack$' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/single-file-plugin-csp.log"

      - name: Upload single-file plugin CSP evidence
        if: always() && matrix.suite == 'plugins'
        uses: actions/upload-artifact@v4
        with:
          name: single-file-plugin-csp-evidence
          path: ${{ runner.temp }}/single-file-plugin-csp.log
          if-no-files-found: ignore

      - name: Guard retained historical plugin packages against current host
        if: matrix.suite == 'plugins'
        timeout-minutes: 4
        env:
          WUU_COMPATIBILITY_EVIDENCE: ${{ runner.temp }}/wuu-plugin-compatibility
        run: make test-plugin-compatibility

      - name: Upload historical plugin compatibility evidence
        if: always() && matrix.suite == 'plugins'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-compatibility-evidence
          path: |
            ${{ runner.temp }}/wuu-plugin-compatibility/**/report.json
            ${{ runner.temp }}/wuu-plugin-compatibility/**/wire.jsonl
            ${{ runner.temp }}/wuu-plugin-compatibility/**/go-test.jsonl
            ${{ runner.temp }}/wuu-plugin-compatibility/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build plugin model acceptance prerequisites
        if: matrix.suite == 'plugins'
        run: |
          npm --prefix packages/plugin-sdk run build
          mkdir -p .tmp/bin
          fixture_version="$(make -s print-version)"
          go build -ldflags "-X github.com/blueberrycongee/wuu/internal/version.Version=${fixture_version}" -o .tmp/bin/wuu ./cmd/wuu

      - name: Guard one-shot plugin model requests
        if: matrix.suite == 'plugins'
        timeout-minutes: 3
        shell: bash
        env:
          WUU_E2E_CORE: ${{ github.workspace }}/.tmp/bin/wuu
          WUU_MODEL_E2E_OUTPUT: ${{ runner.temp }}/wuu-plugin-model-evidence
        run: |
          mkdir -p "$WUU_MODEL_E2E_OUTPUT"
          set -o pipefail
          node scripts/plugin-model-request-e2e.mjs 2>&1 | tee "$WUU_MODEL_E2E_OUTPUT/run.log"

      - name: Upload one-shot plugin model evidence
        if: always() && matrix.suite == 'plugins'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-model-request-evidence
          path: |
            ${{ runner.temp }}/wuu-plugin-model-evidence/*.json
            ${{ runner.temp }}/wuu-plugin-model-evidence/*.jsonl
            ${{ runner.temp }}/wuu-plugin-model-evidence/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard extensible model pipeline journeys
        if: matrix.suite == 'plugins'
        timeout-minutes: 4
        shell: bash
        env:
          WUU_E2E_CORE: ${{ github.workspace }}/.tmp/bin/wuu
          WUU_PIPELINE_E2E_OUTPUT: ${{ runner.temp }}/wuu-plugin-pipeline-evidence
        run: |
          mkdir -p "$WUU_PIPELINE_E2E_OUTPUT"
          set -o pipefail
          packages/plugin-sdk/node_modules/.bin/tsc -p scripts/fixtures/model-pipeline/tsconfig.json
          node scripts/plugin-model-pipeline-e2e.mjs 2>&1 | tee "$WUU_PIPELINE_E2E_OUTPUT/run.log"

      - name: Upload extensible model pipeline evidence
        if: always() && matrix.suite == 'plugins'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-model-pipeline-evidence
          path: |
            ${{ runner.temp }}/wuu-plugin-pipeline-evidence/*.json
            ${{ runner.temp }}/wuu-plugin-pipeline-evidence/*.jsonl
            ${{ runner.temp }}/wuu-plugin-pipeline-evidence/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        if: matrix.suite == 'plugins'
        run: make build-go

      - name: Verify live plugin generation replacement
        if: matrix.suite == 'plugins'
        env:
          WUU_SELF_EXTENSION_EVIDENCE: ${{ runner.temp }}/wuu-plugin-generation-evidence
        run: WUU_SELF_EXTENSION_BINARY="$PWD/bin/wuu" go test -count=1 -run '^TestAgentSelfExtensionProcess$' ./cmd/wuu

      - name: Upload plugin acceptance evidence
        if: always() && matrix.suite == 'plugins'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-runtime-evidence
          path: |
            .tmp/e2e/bundled-plugins/
            ${{ runner.temp }}/wuu-plugin-generation-evidence/
          if-no-files-found: ignore
          retention-days: 14

  go-race:
    name: Go race guards / ${{ matrix.suite }}${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: admission
          - suite: runtime
            shard: 0
          - suite: runtime
            shard: 1
    env:
      WUU_TEST_DATABASE_URL: postgres://wuu:wuu_test@127.0.0.1:5432/wuu_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: wuu
          POSTGRES_PASSWORD: wuu_test
          POSTGRES_DB: wuu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wuu -d wuu_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          cache: false

      # Ordinary build caches can be saved before any race objects are compiled.
      # Give the race detector one complete cache instead of competing for that key.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-v2-${{ matrix.suite }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}


      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install plugin and SDK dependencies
        run: |
          npm ci --prefix packages/plugin-sdk
          npm ci --prefix plugins

      # These guards remain required, but no longer serialize the full Go suite.
      - name: Guard generation admission under race detector
        if: matrix.suite == 'admission'
        timeout-minutes: 10
        run: go test -race -p 2 -count=1 -run '^(TestServerTurnStartDuring|TestServerThreadExecutionLease|TestPluginRefresh|TestFailedPluginRecovery|TestNonturnReceiptFailurePreventsDelivery$|TestTitleReceiptTimeoutRetainsSelectedDocuments$|TestTurnHooksKeepCapturedDispatcherAndJournal$|TestTurnHookReceiptFailuresPreventDelivery$|TestStopHookReceiptFailureSurvivesAnswerReadyCancellation$|TestExternalCapabilities)' ./internal/appserver

      - name: Guard runtime authority and receipts under race detector
        if: matrix.suite == 'runtime'
        timeout-minutes: 10
        env:
          WUU_GO_TEST_RACE: 'true'
          WUU_GO_SHARD_WEIGHTS: '{"TestConcurrentCompletedModelReceiptsSettleWithinOwnerDeadline":200,"TestModelShutdownPersistsBeforeProcessExit":50}'
          WUU_GO_TEST_PATTERN: '^(TestStateAuthority|TestModelShutdownPersistsBeforeProcessExit|TestModelInvocation|Test.*Receipt|TestToolkitHooksFollowCapturedGenerationAndWorkerIdentity$|TestInference(TerminalCheckpoint|DeltaJournalFailure)|TestWorkflowBudget|TestInferenceJournal(PreservesTerminalBeforeDelayedProgress|PendingProgressRejectsMismatchedEvidence|CoalescesStreamingProgressAndFlushesAtBarrier|SettlesLateUsageAfterWorkflowCompletion|CostConfidenceSettlementIsIdempotent|SubmissionEvidenceIsMonotonic|EnforcesOwnerAndDigestBoundaries))'
          WUU_GO_SHARD_EVIDENCE: ${{ runner.temp }}/go-race-shard/manifest.json
        run: node .github/scripts/go-test-shard.mjs ./internal/runtime ${{ matrix.shard }} 2

      - name: Guard supporting receipt and model packages under race detector
        if: matrix.suite == 'admission'
        timeout-minutes: 10
        run: go test -race -p 2 -count=1 -run '^(TestStateAuthority|TestModelShutdownPersistsBeforeProcessExit|TestModelInvocation|Test.*Receipt|TestToolkitHooksFollowCapturedGenerationAndWorkerIdentity$|TestInference(TerminalCheckpoint|DeltaJournalFailure)|TestWorkflowBudget|TestInferenceJournal(PreservesTerminalBeforeDelayedProgress|PendingProgressRejectsMismatchedEvidence|CoalescesStreamingProgressAndFlushesAtBarrier|SettlesLateUsageAfterWorkflowCompletion|CostConfidenceSettlementIsIdempotent|SubmissionEvidenceIsMonotonic|EnforcesOwnerAndDigestBoundaries))' ./internal/session ./internal/providers/... ./internal/modelrequest ./internal/pluginhost ./internal/agent ./internal/agentcontrol ./internal/subagent

      - name: Upload race test inventory
        if: always() && matrix.suite == 'runtime'
        uses: actions/upload-artifact@v4
        with:
          name: go-race-runtime-${{ matrix.shard }}-inventory
          path: ${{ runner.temp }}/go-race-shard/manifest.json
          if-no-files-found: warn

  architecture-conformance:
    name: Public provider conformance / ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.architecture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [controller, authority, cooperation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            clients/core/package-lock.json
            packages/plugin-sdk/package-lock.json
            plugins/package-lock.json
            desktop/package-lock.json

      - name: Install public SDK, provider and renderer test dependencies
        run: |
          npm ci --prefix clients/core
          npm ci --prefix packages/plugin-sdk
          npm ci --prefix plugins
          # The additive fixture uses Vitest/jsdom, not Electron or node-pty.
          npm ci --prefix desktop --ignore-scripts

      - name: Build the tested revision and record its identity
        id: conformance-build
        timeout-minutes: 8
        run: |
          mkdir -p .tmp/bin .tmp/e2e/architecture-conformance
          git rev-parse HEAD > .tmp/e2e/architecture-conformance/source-commit.txt
          npm --prefix packages/plugin-sdk run build
          npm --prefix plugins run build
          git diff --exit-code -- internal/plugin/bundled
          fixture_version="$(make -s print-version)"
          go build -ldflags "-X github.com/blueberrycongee/wuu/internal/version.Version=${fixture_version}" -o .tmp/bin/wuu ./cmd/wuu
          sha256sum .tmp/bin/wuu > .tmp/e2e/architecture-conformance/binary.sha256
          go version -m .tmp/bin/wuu > .tmp/e2e/architecture-conformance/build-info.txt

      # Independent suites continue after a peer fails so one broken boundary
      # does not hide the others. Every failed step still fails this job.
      - name: Verify registered existing-session controller loop
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'controller' }}
        timeout-minutes: 6
        shell: bash
        env:
          WUU_REGISTERED_SESSION_EVIDENCE: ${{ github.workspace }}/.tmp/e2e/architecture-conformance/registered-session.json
        run: |
          set -o pipefail
          # Builds the native fixture binary and requires real-core reports;
          # unlike ordinary Vitest, this cannot silently skip the journey.
          node scripts/registered-session-transport-e2e.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/registered-session.log

      - name: Verify independent state authority
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'authority' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          node scripts/state-authority-acceptance/run.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/state-authority.log

      - name: Verify independent restricted session sharing
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'authority' }}
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          node scripts/session-sharing-e2e.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/session-sharing.log

      - name: Verify selected artifact provider through the Go boundary
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'authority' }}
        timeout-minutes: 6
        shell: bash
        # Rendered preview and native open-with remain separate UI acceptance.
        env:
          WUU_ARTIFACT_ACCEPTANCE_RENDERER: '0'
        run: |
          set -o pipefail
          node scripts/artifact-provider-acceptance.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/artifact-provider.log

      - name: Verify minimal composition through the public executable
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'controller' }}
        timeout-minutes: 4
        shell: bash
        env:
          WUU_MINIMAL_BINARY: ${{ github.workspace }}/.tmp/bin/wuu
          WUU_MINIMAL_SDK_ROOT: ${{ github.workspace }}/packages/plugin-sdk
        run: |
          set -o pipefail
          node packages/plugin-sdk/test/minimal-package.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/minimal-composition.log

      - name: Verify independent identity and resource policy
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'controller' }}
        timeout-minutes: 4
        shell: bash
        env:
          WUU_AUTH_BINARY: ${{ github.workspace }}/.tmp/bin/wuu
          WUU_AUTH_SDK_ROOT: ${{ github.workspace }}/packages/plugin-sdk
        run: |
          set -o pipefail
          node packages/plugin-sdk/test/resource-access-package.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/resource-access.log

      - name: Verify owned live progress through the public SDK
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'controller' }}
        timeout-minutes: 4
        shell: bash
        env:
          WUU_SESSION_PROGRESS_BINARY: ${{ github.workspace }}/.tmp/bin/wuu
        run: |
          set -o pipefail
          node packages/plugin-sdk/test/session-progress-package.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/session-progress.log

      - name: Verify partial provider delegation through the public SDK
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'authority' }}
        timeout-minutes: 6
        shell: bash
        env:
          WUU_DELEGATION_SDK_ROOT: ${{ github.workspace }}/packages/plugin-sdk
        run: |
          set -o pipefail
          node scripts/provider-delegation-e2e.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/provider-delegation.log

      - name: Verify selected-service continuation authority
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'authority' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          node scripts/service-continuation-e2e.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/service-continuation.log

      - name: Verify default native tools in product compositions
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'cooperation' }}
        timeout-minutes: 5
        shell: bash
        env:
          WUU_E2E_CORE: ${{ github.workspace }}/.tmp/bin/wuu
        run: |
          set -o pipefail
          node scripts/composition-e2e.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/native-composition.log

      - name: Verify public federated session routing
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'cooperation' }}
        timeout-minutes: 5
        shell: bash
        env:
          WUU_E2E_CORE: ${{ github.workspace }}/.tmp/bin/wuu
        # The fixture packs remote-core's public TypeScript sources and installs
        # the two tarballs independently; no renderer or remote bundle is reused.
        run: |
          set -o pipefail
          node scripts/session-federation-e2e.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/session-federation.log

      - name: Verify encrypted desktop delegation into the original core
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'cooperation' }}
        timeout-minutes: 4
        shell: bash
        env:
          WUU_AUTH_BINARY: ${{ github.workspace }}/.tmp/bin/wuu
          WUU_AUTH_SDK_ROOT: ${{ github.workspace }}/packages/plugin-sdk
        run: |
          set -o pipefail
          node desktop/scripts/trusted-desktop-e2e.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/trusted-desktop.log

      - name: Verify independent additive packages across process and renderer
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'cooperation' }}
        timeout-minutes: 4
        shell: bash
        env:
          WUU_ADDITIVE_BINARY: ${{ github.workspace }}/.tmp/bin/wuu
          WUU_ADDITIVE_OUTPUT: ${{ github.workspace }}/.tmp/e2e/additive-cooperation
        run: |
          set -o pipefail
          node packages/plugin-sdk/test/additive-package.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/additive-cooperation.log

      - name: Verify optional plugin failure isolation and recovery
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' && matrix.suite == 'cooperation' }}
        timeout-minutes: 4
        shell: bash
        env:
          WUU_E2E_CORE: ${{ github.workspace }}/.tmp/bin/wuu
          WUU_ISOLATION_EVIDENCE: ${{ github.workspace }}/.tmp/e2e/plugin-failure-isolation
        run: |
          set -o pipefail
          node scripts/plugin-failure-isolation-e2e.mjs 2>&1 | tee .tmp/e2e/architecture-conformance/plugin-failure-isolation.log

      - name: Verify MCP authentication across compatible reloads
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        env:
          WUU_MCP_AUTH_E2E_OUTPUT: ${{ github.workspace }}/.tmp/e2e/mcp-auth-reload
        run: |
          set -euo pipefail
          mkdir -p "$WUU_MCP_AUTH_E2E_OUTPUT"
          git rev-parse HEAD > "$WUU_MCP_AUTH_E2E_OUTPUT/source-commit.txt"
          fixture_version="$(make -s print-version)"
          go build -ldflags "-X github.com/blueberrycongee/wuu/internal/version.Version=${fixture_version}" -o .tmp/bin/mcp-auth-reload-e2e ./scripts/mcp-auth-reload-e2e
          sha256sum .tmp/bin/mcp-auth-reload-e2e > .tmp/e2e/architecture-conformance/mcp-auth-reload.binary.sha256
          go version -m .tmp/bin/mcp-auth-reload-e2e > .tmp/e2e/architecture-conformance/mcp-auth-reload-build-info.txt
          .tmp/bin/mcp-auth-reload-e2e 2>&1 | tee .tmp/e2e/architecture-conformance/mcp-auth-reload.log

      - name: Require executed boundary cases and passing reports
        env:
          WUU_CONFORMANCE_SUITE: ${{ matrix.suite }}
        if: ${{ !cancelled() && steps.conformance-build.outcome == 'success' }}
        run: |
          sha256sum --check .tmp/e2e/architecture-conformance/binary.sha256
          sha256sum --check .tmp/e2e/architecture-conformance/mcp-auth-reload.binary.sha256
          node .github/scripts/check-mcp-auth-evidence.mjs .tmp/e2e/mcp-auth-reload .tmp/bin/mcp-auth-reload-e2e "$(git rev-parse HEAD)"
          node .github/scripts/verify-provider-evidence.mjs

      - name: Preserve public boundary evidence without fixture credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-conformance-${{ matrix.suite }}-evidence
          # Never upload fixture directories, homes, config, key material or
          # token stores. Only these reports and fixture diagnostic logs leave
          # the runner, including on fixture failure.
          path: |
            .tmp/e2e/architecture-conformance/*.txt
            .tmp/e2e/architecture-conformance/*.sha256
            .tmp/e2e/architecture-conformance/*.log
            .tmp/e2e/mcp-auth-reload/results.json
            .tmp/e2e/mcp-auth-reload/source-commit.txt

            .tmp/e2e/architecture-conformance/registered-session*.json
            .tmp/e2e/plugin-failure-isolation/run-*/result.json
            .tmp/e2e/provider-authority/run-*/environment.json
            .tmp/e2e/provider-authority/run-*/verification.log
            .tmp/e2e/session-sharing/run-*/environment.json
            .tmp/e2e/session-sharing/run-*/verification.log
            .tmp/artifact-provider-acceptance/run-*/report.json
            .tmp/artifact-provider-acceptance/run-*/verification.log
            .tmp/e2e/minimal-composition/run-*/result.json
            .tmp/e2e/session-progress/run-*/report.json
            .tmp/e2e/session-progress/run-*/transcript.jsonl
            .tmp/e2e/minimal-composition/run-*/default-composer.log
            .tmp/e2e/resource-access/run-*/result.json
            .tmp/e2e/session-federation/run-*/results.json
            .tmp/e2e/session-federation/run-*/commands.json
            .tmp/e2e/trusted-desktop/run-*/result.json
            .tmp/e2e/trusted-desktop/run-*/go-test.log
            .tmp/e2e/trusted-desktop/run-*/failure.log
            .tmp/e2e/provider-delegation/run-*/report.json
            .tmp/e2e/provider-delegation/run-*/verification.log
            .tmp/e2e/service-continuation/run-*/report.json
            .tmp/e2e/service-continuation/run-*/verification.log
            .tmp/e2e/composition/run-*/results.json
            .tmp/e2e/composition/run-*/requests.json
            .tmp/e2e/composition/run-*/transcript.json
            .tmp/e2e/composition/run-*/app-server.stderr
            .tmp/e2e/additive-cooperation/inputs.json
            .tmp/e2e/additive-cooperation/result.json
            .tmp/e2e/additive-cooperation/renderer.log
            .tmp/e2e/additive-cooperation/failure.log
          if-no-files-found: warn
          retention-days: 14

  go-check:
    name: Go check
    runs-on: ubuntu-latest
    needs: [changes, go-validation, go-race, architecture-conformance]
    # Evaluate failed dependencies, but let superseded workflow runs cancel.
    if: ${{ !cancelled() }}
    steps:
      - name: Require selected Go suites
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          GO_REQUIRED: ${{ needs.changes.outputs.go }}
          ARCHITECTURE_REQUIRED: ${{ needs.changes.outputs.architecture }}
          ARCHITECTURE_RESULT: ${{ needs.architecture-conformance.result }}
          GO_VALIDATION_RESULT: ${{ needs.go-validation.result }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$GO_REQUIRED" = true ]; then
            test "$GO_VALIDATION_RESULT" = success
            test "$GO_RACE_RESULT" = success
          else
            test "$GO_VALIDATION_RESULT" = skipped
            test "$GO_RACE_RESULT" = skipped
          fi
          if [ "$ARCHITECTURE_REQUIRED" = true ]; then
            test "$ARCHITECTURE_RESULT" = success
          else
            test "$ARCHITECTURE_RESULT" = skipped
          fi

  desktop-unit:
    name: Desktop / ${{ matrix.suite }}
    needs: changes
    # Unit tests never consume the immutable renderer/core artifact.
    if: needs.changes.outputs.desktop == 'true' && contains(fromJSON(needs.changes.outputs.desktop_suites), 'unit')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, unit-extra]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json

      - name: Install
        shell: bash
        run: |
          # Independent dependency stores prepare together. Join all
          # workers before Electron extraction or any acceptance test starts.
          npm ci --prefix desktop &
          pids=("$!")
          npm ci --prefix clients/core &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          # Electron downloads lazily on require; parallel Vitest workers must
          # not extract into the same dist directory at the same time.
          node desktop/node_modules/electron/install.js
          node -e 'require("./desktop/node_modules/electron")'

      - name: Typecheck
        if: ${{ matrix.suite == 'unit' }}
        run: make check-desktop

      - name: Guard development renderer recovery
        if: ${{ matrix.suite == 'unit' }}
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/wuu-renderer-recovery-evidence"
          set -o pipefail
          xvfb-run --auto-servernum npm --prefix desktop run test:renderer-recovery -- --no-sandbox 2>&1 | tee "${{ runner.temp }}/wuu-renderer-recovery-evidence/run.log"

      - name: Upload renderer recovery evidence
        if: ${{ matrix.suite == 'unit' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: renderer-recovery-evidence
          path: ${{ runner.temp }}/wuu-renderer-recovery-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify unit dependency selection
        if: ${{ matrix.suite == 'unit' }}
        run: node --test desktop/scripts/ci-unit-dependencies.test.mjs desktop/scripts/ci-unit-plan.test.mjs

      - name: Test
        env:
          WUU_CI_RELATED: ${{ needs.changes.outputs.desktop_related }}
          WUU_CI_UNIT_SHARD: ${{ matrix.suite == 'unit' && '1/2' || '2/2' }}
        run: node desktop/scripts/test-ci-unit.mjs

      - name: Upload unit dependency selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-dependency-selection-${{ matrix.suite }}
          path: desktop/out/ci/unit-related.json
          if-no-files-found: ignore
          retention-days: 14


  desktop-suite:
    name: Desktop / ${{ matrix.suite }}
    needs: [changes, repository-check]
    if: ${{ !cancelled() && needs.changes.outputs.desktop == 'true' && needs.changes.outputs.desktop_e2e_suites != '[]' && needs.repository-check.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.desktop_e2e_suites) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json

      - name: Install
        shell: bash
        run: |
          # Independent dependency stores and apt can prepare together. Join all
          # workers before Electron extraction or any acceptance test starts.
          npm ci --prefix desktop &
          pids=("$!")
          npm ci --prefix clients/core &
          pids+=("$!")
          (
            for apt_source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt; do
              if [ -f "$apt_source" ]; then
                sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
              fi
            done
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji xdotool
          ) &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          # Electron downloads lazily on require; parallel Vitest workers must
          # not extract into the same dist directory at the same time.
          node desktop/node_modules/electron/install.js
          node -e 'require("./desktop/node_modules/electron")'

      - uses: actions/download-artifact@v4
        with:
          name: desktop-ci-build
          path: ${{ runner.temp }}/desktop-ci-build

      - name: Build
        # Every consumer verifies immutable output from this exact workflow run.
        id: build-renderer
        shell: bash
        run: |
          tar -xf "$RUNNER_TEMP/desktop-ci-build/desktop-ci-build.tar"
          test "$(cat .tmp/desktop-ci-build/source-commit.txt)" = "$(git rev-parse HEAD)"
          sha256sum --check .tmp/desktop-ci-build/bundle.sha256
          find desktop/out/renderer -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/wuu-initial-renderer.sha256"

      - name: Confirm multilingual capture dependencies
        id: install-desktop-fonts
        if: ${{ !cancelled() && steps.build-renderer.outcome == 'success' }}
        run: dpkg-query -W fonts-noto-cjk fonts-noto-color-emoji xdotool

      - name: Guard independent feature, inspection, and resize UI
        id: feature-ui-rendering
        if: ${{ matrix.suite == 'layout' && (!cancelled() && steps.build-renderer.outcome == 'success' && steps.install-desktop-fonts.outcome == 'success') }}
        timeout-minutes: 8
        shell: bash
        env:
          WUU_FEATURE_UI_VISUAL_OUTPUT: ${{ runner.temp }}/wuu-feature-ui-rendering-evidence
          WUU_ARTIFACT_E2E_ONLY: inspection
          WUU_ARTIFACT_OUTPUT: ${{ runner.temp }}/wuu-image-inspection-evidence
          WUU_RESIZE_OUTPUT: ${{ runner.temp }}/wuu-resize-live-evidence/results.json
        run: |
          # Private profiles and displays; preserve each journey's original timeout.
          (
            status=0
            timeout --kill-after=10s 5m bash -e -o pipefail <<'FEATURE' || status=1
          set -euo pipefail
          mkdir -p "$WUU_FEATURE_UI_VISUAL_OUTPUT"
          # Missing Chromium must fail this gate rather than silently skip pixels.
          if command -v google-chrome > /dev/null; then
            export WUU_CHROMIUM="$(command -v google-chrome)"
          elif command -v chromium > /dev/null; then
            export WUU_CHROMIUM="$(command -v chromium)"
          elif command -v chromium-browser > /dev/null; then
            export WUU_CHROMIUM="$(command -v chromium-browser)"
          else
            echo "Chromium/Google Chrome is required for feature UI pixel acceptance" | tee "$WUU_FEATURE_UI_VISUAL_OUTPUT/run.log"
            exit 1
          fi
          node scripts/external-composition-acceptance/ui/visual.mjs 2>&1 | tee "$WUU_FEATURE_UI_VISUAL_OUTPUT/run.log"
          FEATURE
            timeout --kill-after=10s 3m bash -e -o pipefail <<'INSPECTION' || status=1
          mkdir -p "$WUU_ARTIFACT_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/artifact-preview-e2e.cjs 2>&1 | tee "$WUU_ARTIFACT_OUTPUT/run.log"
          INSPECTION
            exit "$status"
          ) &
          feature_pid=$!
          (
            timeout --kill-after=10s 3m bash -e -o pipefail <<'RESIZE'
          mkdir -p "$(dirname "$WUU_RESIZE_OUTPUT")"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/resize-live-layout-e2e.cjs 2>&1 | tee "$(dirname "$WUU_RESIZE_OUTPUT")/run.log"
          RESIZE
          ) &
          resize_pid=$!
          status=0
          wait "$feature_pid" || status=1
          wait "$resize_pid" || status=1
          exit "$status"
      - name: Upload independent feature UI rendering evidence
        if: ${{ matrix.suite == 'layout' && always() && steps.feature-ui-rendering.outcome != 'skipped' && steps.feature-ui-rendering.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-ui-rendering-evidence
          path: ${{ runner.temp }}/wuu-feature-ui-rendering-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Capture sidebar surface review
        # Before/after review evidence is scoped to this visual-change branch.
        if: ${{ matrix.suite == 'shell' && (!cancelled() && steps.build-renderer.outcome == 'success' && github.head_ref == 'fix/sidebar-selection-insets') }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          output="${{ runner.temp }}/wuu-sidebar-surface-evidence"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/source-commit.txt"
          (cd desktop && node_modules/.bin/vite --config dev/sidebar-accessories/vite.config.ts) > "$output/vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5208/dev/sidebar-accessories/ > /dev/null; then break; fi
            kill -0 "$vite_pid"
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:5208/dev/sidebar-accessories/ > /dev/null
          for variant in before after; do
            baseline=0
            if [ "$variant" = before ]; then baseline=1; fi
            WUU_SIDEBAR_BASELINE="$baseline" WUU_SIDEBAR_OUTPUT="$output/$variant" \
              xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/dev/sidebar-accessories/capture.cjs 2>&1 | tee "$output/$variant.log"
          done
          python3 - "$output" <<'PYTHON'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          before = json.loads((root / "before/geometry.json").read_text())["report"]
          after = json.loads((root / "after/geometry.json").read_text())["report"]
          for name, states in before.items():
              for state, measurement in states.items():
                  for old, new in zip(measurement["rows"], after[name][state]["rows"], strict=True):
                      assert new["bounds"]["width"] < old["bounds"]["width"], (name, state, "surface did not narrow")
                      for key in ("x", "width", "height"):
                          assert abs(new["title"][key] - old["title"][key]) < 0.1, (name, state, key, "title geometry changed")
          print("PASS: before/after surfaces narrow while title geometry stays fixed")
          PYTHON
          WUU_SIDEBAR_FULL_CAPTURE=1 WUU_SCROLL_FADE_OUTPUT="$output/full" \
            xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/sidebar-scroll-fade-e2e.cjs 2>&1 | tee "$output/full.log"

      - name: Upload sidebar surface evidence
        if: ${{ matrix.suite == 'shell' && (always() && github.head_ref == 'fix/sidebar-selection-insets') }}
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-surface-evidence
          path: ${{ runner.temp }}/wuu-sidebar-surface-evidence
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/setup-go@v5
        if: ${{ matrix.suite == 'shell' }}
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Exercise bounded shell journeys
        if: ${{ matrix.suite == 'shell' && !cancelled() && steps.build-renderer.outcome == 'success' }}
        shell: bash
        run: |
          # Concurrent acceptance preserves assertions, not unloaded timing comparability.
          echo 'Concurrent acceptance: do not compare timings to unloaded baselines.'
          run_journey() {
            local label="$1" limit="$2" result=0
            shift 2
            timeout --kill-after=15s "$limit" env "$@" bash --noprofile --norc -e -o pipefail || result=$?
            printf '%s: exit %s\n' "$label" "$result"
            if [ "$result" -ne 0 ]; then failed=1; fi
          }
          (
            failed=0
            run_journey 'Guard titlebar alignment and sidebar hit targets' 3m  <<'WUU_JOURNEY_1_1'
          node --test desktop/scripts/header-hit-ownership.test.cjs
          mkdir -p desktop/out/e2e/settings-titlebar
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/settings-sidebar-hit-e2e.cjs 2>&1 | tee desktop/out/e2e/settings-titlebar/run.log
          WUU_JOURNEY_1_1
            run_journey 'Guard composer inline extension foundation' 3m 'WUU_INLINE_E2E_OUTPUT=${{ runner.temp }}/wuu-composer-inline-evidence' <<'WUU_JOURNEY_1_3'
          mkdir -p "$WUU_INLINE_E2E_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/composer-inline-e2e.cjs 2>&1 | tee "$WUU_INLINE_E2E_OUTPUT/run.log"
          WUU_JOURNEY_1_3
            run_journey 'Guard composer and process summary colors' 3m 'WUU_PROCESS_SUMMARY_OUTPUT=${{ runner.temp }}/wuu-process-summary-evidence' <<'WUU_JOURNEY_1_4'
          mkdir -p "$WUU_PROCESS_SUMMARY_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/process-compaction-summary-e2e.cjs 2>&1 | tee "$WUU_PROCESS_SUMMARY_OUTPUT/run.log"
          WUU_JOURNEY_1_4
            exit "$failed"
          ) &
          worker_1=$!
          (
            failed=0
            run_journey 'Guard workspace tabs and navigation' 3m  <<'WUU_JOURNEY_2_1'
          mkdir -p desktop/out/workspace-new-tab-e2e
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/workspace-new-tab-e2e.cjs 2>&1 | tee desktop/out/workspace-new-tab-e2e/run.log
          WUU_JOURNEY_2_1
            run_journey 'Verify onboarding scroll-edge fades' 3m WUU_SCROLL_FADE_ONBOARDING=1 'WUU_SCROLL_FADE_OUTPUT=${{ runner.temp }}/wuu-onboarding-scroll-evidence' <<'WUU_JOURNEY_2_3'
          mkdir -p "$WUU_SCROLL_FADE_OUTPUT"
          set -o pipefail
          (cd desktop && node_modules/.bin/electron-vite build --config dev/onboarding/electron.vite.config.ts --ignoreConfigWarning)
          xvfb-run --auto-servernum --server-args='-screen 0 1800x1800x24' desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/sidebar-scroll-fade-e2e.cjs 2>&1 | tee "$WUU_SCROLL_FADE_OUTPUT/run.log"
          WUU_JOURNEY_2_3
            run_journey 'Guard native Settings overlay visibility and interaction' 3m  <<'WUU_JOURNEY_2_4'
          mkdir -p desktop/out/e2e/settings-overlay
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/settings-overlay-e2e.cjs 2>&1 | tee desktop/out/e2e/settings-overlay/run.log
          WUU_JOURNEY_2_4
            run_journey 'Guard independently distributed conversation addons' 3m 'WUU_CONVERSATION_ADDONS_OUTPUT=${{ runner.temp }}/wuu-conversation-addons-evidence' <<'WUU_JOURNEY_2_6'
          mkdir -p "$WUU_CONVERSATION_ADDONS_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/conversation-addons-e2e.cjs 2>&1 | tee "$WUU_CONVERSATION_ADDONS_OUTPUT/run.log"
          WUU_JOURNEY_2_6
            exit "$failed"
          ) &
          worker_2=$!
          (
            failed=0
            run_journey 'Guard account quota behavior and layout' 5m 'WUU_QUOTA_OUTPUT=${{ runner.temp }}/wuu-subscription-quota-evidence' <<'WUU_JOURNEY_1_2'
          mkdir -p "$WUU_QUOTA_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/subscription-quota-e2e.cjs 2>&1 | tee "$WUU_QUOTA_OUTPUT/run.log"
          WUU_JOURNEY_1_2
            run_journey 'Guard sidebar and streaming scroll-edge fades' 3m 'WUU_SCROLL_FADE_OUTPUT=${{ runner.temp }}/wuu-sidebar-scroll-fade-evidence' <<'WUU_JOURNEY_2_5'
          mkdir -p "$WUU_SCROLL_FADE_OUTPUT"
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/sidebar-scroll-fade-e2e.cjs 2>&1 | tee "$WUU_SCROLL_FADE_OUTPUT/run.log"
          WUU_JOURNEY_2_5
            run_journey 'Guard disabled app snapshots and system permissions' 3m  <<'WUU_JOURNEY_2_7'
          mkdir -p desktop/out/app-context-e2e
          set -o pipefail
          xvfb-run --auto-servernum desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/app-context-e2e.cjs 2>&1 | tee desktop/out/app-context-e2e/run.log
          WUU_JOURNEY_2_7
            run_journey 'Guard titlebar rename interactions' 3m 'WUU_TITLEBAR_OUTPUT=${{ runner.temp }}/wuu-titlebar-evidence' <<'WUU_JOURNEY_2_8'
