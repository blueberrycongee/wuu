  desktop-macos-controls:
    name: Desktop / macOS focused controls
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && contains(fromJSON(needs.changes.outputs.desktop_suites), 'shell')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VITE_ENABLE_ACCOUNT: 'false'
      VITE_ENABLE_REMOTE_CONTROL: 'false'
      WUU_RELEASE: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      WUU_TITLEBAR_FOCUSED_CONTROLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json
            plugins/package-lock.json
      - name: Install locked renderer dependencies
        id: install-focused-dependencies
        timeout-minutes: 10
        run: |
          pids=()
          for workspace in desktop clients/core clients/mobile-web plugins; do
            npm ci --prefix "$workspace" &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          node desktop/node_modules/electron/install.js
          node -e 'require("./desktop/node_modules/electron")'
      - name: Verify production browser preview window ordering
        if: ${{ !cancelled() && steps.install-focused-dependencies.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        env:
          WUU_BROWSER_PIP_E2E_ARTIFACTS: ${{ runner.temp }}/wuu-browser-preview-ordering
          WUU_BROWSER_PIP_ORDERING_ONLY: '1'
        run: |
          mkdir -p "$WUU_BROWSER_PIP_E2E_ARTIFACTS"
          git rev-parse HEAD > "$WUU_BROWSER_PIP_E2E_ARTIFACTS/source-commit.txt"
          set -o pipefail
          node desktop/scripts/browser-pip-e2e.cjs 2>&1 | tee "$WUU_BROWSER_PIP_E2E_ARTIFACTS/run.log"
      - name: Upload production browser preview ordering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview-ordering-macos-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/wuu-browser-preview-ordering/
          if-no-files-found: warn
          retention-days: 14
      - name: Build production renderer
        id: build-focused-renderer
        timeout-minutes: 6
        # Same renderer build as Linux shell fixtures; synthetic preload does
        # not require native core packaging or bundled plugin execution.
        run: cd desktop && node_modules/.bin/electron-vite build
      - name: Build the shipped Personal desktop fixture
        id: build-personal-fixture
        if: ${{ !cancelled() && steps.install-focused-dependencies.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        env:
          PERSONAL_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p desktop/out/personal-desktop-acceptance
          node <<'NODE' > desktop/out/personal-desktop-acceptance/source.json
          const { execFileSync } = require('node:child_process');
          console.log(JSON.stringify({
            checkout_sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            event_sha: process.env.GITHUB_SHA,
            pull_request_head_sha: process.env.PERSONAL_PR_HEAD || null,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            platform: process.platform,
            architecture: process.arch,
            node_version: process.version,
            electron_version: require('./desktop/node_modules/electron/package.json').version,
            playwright_version: require('./clients/mobile-web/node_modules/playwright/package.json').version,
            scope: 'Production Personal desktop contribution and application shell; synthetic transport, no live accounts, model or external effects',
          }, null, 2));
          NODE
          set -o pipefail
          node scripts/build-personal-desktop.mjs --check 2>&1 | tee desktop/out/personal-desktop-acceptance/build.log
          node desktop/scripts/build-personal-fixture.cjs 2>&1 | tee -a desktop/out/personal-desktop-acceptance/build.log
          shasum -a 256 desktop/out/personal-fixture/index.html \
            internal/plugin/bundled/personal/desktop.js \
            internal/plugin/bundled/personal-calendar/desktop.js \
            desktop/package-lock.json clients/mobile-web/package-lock.json \
            > desktop/out/personal-desktop-acceptance/inputs.sha256
      - name: Install locked Chromium for Personal desktop approval checks
        id: install-personal-chromium
        if: ${{ !cancelled() && steps.build-personal-fixture.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          clients/mobile-web/node_modules/.bin/playwright install chromium 2>&1 | tee desktop/out/personal-desktop-acceptance/chromium-install.log
      - name: Exercise native controls and headless Personal approval
        if: ${{ !cancelled() && steps.build-focused-renderer.outcome == 'success' && steps.build-personal-fixture.outcome == 'success' && steps.install-personal-chromium.outcome == 'success' }}
        timeout-minutes: 6
        shell: bash
        env:
          WUU_TITLEBAR_OUTPUT: ${{ runner.temp }}/wuu-macos-focused-controls
          WUU_ERROR_FEEDBACK_OUTPUT: ${{ runner.temp }}/wuu-macos-error-feedback
          WUU_SETTINGS_OVERLAY_OUTPUT: ${{ runner.temp }}/wuu-macos-settings-overlay
          WUU_PERSONAL_SETTINGS_OUTPUT: ${{ github.workspace }}/desktop/out/personal-desktop-acceptance/settings
          WUU_REVIEW_PLAYWRIGHT_PATH: ${{ github.workspace }}/clients/mobile-web/node_modules/playwright
          WUU_REVIEW_UI_OUTPUT: ${{ github.workspace }}/desktop/out/personal-desktop-acceptance/approval
        run: |
          # Native windows share focus, so keep their checks serial. Headless
          # Chromium uses separate contexts and evidence paths and can overlap.
          (
            set +e
            set -o pipefail
            status=0
            (
              set -e
              mkdir -p "$WUU_TITLEBAR_OUTPUT"
              git rev-parse HEAD > "$WUU_TITLEBAR_OUTPUT/source-commit.txt"
              set -o pipefail
              desktop/node_modules/.bin/electron desktop/scripts/settings-sidebar-hit-e2e.cjs 2>&1 | tee "$WUU_TITLEBAR_OUTPUT/run.log"
            )
            result=$?
            echo "header: $result" | tee -a desktop/out/personal-desktop-acceptance/native-results.log
            if [ "$result" -ne 0 ]; then status=1; fi
            (
              set -e
              mkdir -p "$WUU_ERROR_FEEDBACK_OUTPUT"
              git rev-parse HEAD > "$WUU_ERROR_FEEDBACK_OUTPUT/source-commit.txt"
              set -o pipefail
              desktop/node_modules/.bin/electron desktop/scripts/error-feedback-e2e.cjs 2>&1 | tee "$WUU_ERROR_FEEDBACK_OUTPUT/run.log"
            )
            result=$?
            echo "error-feedback: $result" | tee -a desktop/out/personal-desktop-acceptance/native-results.log
            if [ "$result" -ne 0 ]; then status=1; fi
            (
              set -e
              mkdir -p "$WUU_SETTINGS_OVERLAY_OUTPUT"
              git rev-parse HEAD > "$WUU_SETTINGS_OVERLAY_OUTPUT/source-commit.txt"
              set -o pipefail
              desktop/node_modules/.bin/electron desktop/scripts/settings-overlay-e2e.cjs 2>&1 | tee "$WUU_SETTINGS_OVERLAY_OUTPUT/run.log"
            )
            result=$?
            echo "overlay: $result" | tee -a desktop/out/personal-desktop-acceptance/native-results.log
            if [ "$result" -ne 0 ]; then status=1; fi
            (
              set -e
              set -o pipefail
              desktop/node_modules/.bin/electron desktop/scripts/personal-settings-e2e.cjs 2>&1 | tee desktop/out/personal-desktop-acceptance/settings.log
            )
            result=$?
            echo "personal-settings: $result" | tee -a desktop/out/personal-desktop-acceptance/native-results.log
            if [ "$result" -ne 0 ]; then status=1; fi
            (
              set -e
              set -o pipefail
              WUU_MESSAGE_FLOW_OUTPUT=desktop/out/personal-desktop-acceptance/message-flow \
                desktop/node_modules/.bin/electron desktop/scripts/personal-message-flow-e2e.cjs 2>&1 | tee desktop/out/personal-desktop-acceptance/message-flow.log
            )
            result=$?
            echo "personal-message-flow: $result" | tee -a desktop/out/personal-desktop-acceptance/native-results.log
            if [ "$result" -ne 0 ]; then status=1; fi
            exit "$status"
          ) &
          native_pid=$!
          (
            set +e
            set -o pipefail
            node desktop/scripts/personal-approval-ui-e2e.cjs 2>&1 | tee desktop/out/personal-desktop-acceptance/approval.log
            approval_status=$?
            echo "approval: $approval_status" | tee -a desktop/out/personal-desktop-acceptance/approval.log
            exit "$approval_status"
          ) &
          approval_pid=$!
          status=0
          wait "$native_pid" || status=1
          wait "$approval_pid" || status=1
          # Verify immutable inputs after BOTH acceptance lanes have stopped.
          shasum -a 256 --check desktop/out/personal-desktop-acceptance/inputs.sha256 || status=1
          exit "$status"
      - name: Exercise error feedback after prerequisite failure
        id: error-feedback-components
        if: ${{ !cancelled() && steps.install-focused-dependencies.outcome == 'success' && (steps.build-focused-renderer.outcome != 'success' || steps.build-personal-fixture.outcome != 'success' || steps.install-personal-chromium.outcome != 'success') }}
        timeout-minutes: 3
        shell: bash
        env:
          WUU_ERROR_FEEDBACK_OUTPUT: ${{ runner.temp }}/wuu-macos-error-feedback
        # Synthetic services and actual renderer components, not full-App or
        # physical-display acceptance. No core or account is required.
        run: |
          mkdir -p "$WUU_ERROR_FEEDBACK_OUTPUT"
          git rev-parse HEAD > "$WUU_ERROR_FEEDBACK_OUTPUT/source-commit.txt"
          set -o pipefail
          desktop/node_modules/.bin/electron desktop/scripts/error-feedback-e2e.cjs 2>&1 | tee "$WUU_ERROR_FEEDBACK_OUTPUT/run.log"
      - name: Upload hosted macOS Personal desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-desktop-hosted-macos-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          # Do not upload Electron profiles or the embedded fixture bundle.
          path: |
            desktop/out/personal-desktop-acceptance/*.json
            desktop/out/personal-desktop-acceptance/*.log
            desktop/out/personal-desktop-acceptance/*.sha256
            desktop/out/personal-desktop-acceptance/settings/*.json
            desktop/out/personal-desktop-acceptance/settings/*.png
            desktop/out/personal-desktop-acceptance/settings/*.txt
            desktop/out/personal-desktop-acceptance/approval/*.json
            desktop/out/personal-desktop-acceptance/approval/*.png
            desktop/out/personal-desktop-acceptance/message-flow/*.json
            desktop/out/personal-desktop-acceptance/message-flow/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload hosted macOS error feedback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-feedback-hosted-macos-evidence
          path: ${{ runner.temp }}/wuu-macos-error-feedback/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload hosted macOS Settings overlay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-overlay-hosted-macos-evidence
          path: ${{ runner.temp }}/wuu-macos-settings-overlay/
          if-no-files-found: warn
          retention-days: 14
      - name: Build native core for connector authorization acceptance
        id: build-connector-core
        if: ${{ !cancelled() && steps.install-focused-dependencies.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          mkdir -p desktop/build/bin desktop/out/e2e/plugin-management
          git rev-parse HEAD > desktop/out/e2e/plugin-management/source-commit.txt
          fixture_version="v$(tr -d '\n' < VERSION)"
          go build -ldflags "-X github.com/blueberrycongee/wuu/internal/version.Version=${fixture_version}" -o desktop/build/bin/wuu-core ./cmd/wuu
      - name: Exercise sandboxed connector picker and loopback OAuth
        if: ${{ !cancelled() && steps.build-connector-core.outcome == 'success' }}
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          desktop/node_modules/.bin/electron desktop/scripts/plugin-management-e2e.cjs --mcp-only 2>&1 | tee desktop/out/e2e/plugin-management/run.log
      - name: Upload hosted macOS connector authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-desktop-hosted-macos-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          # Disposable profiles and the fixture credential store are never artifacts.
          path: |
            desktop/out/e2e/plugin-management/*.png
            desktop/out/e2e/plugin-management/*.json
            desktop/out/e2e/plugin-management/*.txt
            desktop/out/e2e/plugin-management/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload hosted macOS control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titlebar-hosted-macos-controls-evidence
          path: |
            ${{ runner.temp }}/wuu-macos-focused-controls/*.png
            ${{ runner.temp }}/wuu-macos-focused-controls/*.json
            ${{ runner.temp }}/wuu-macos-focused-controls/*.log
            ${{ runner.temp }}/wuu-macos-focused-controls/*.txt
          if-no-files-found: warn
          retention-days: 14

  desktop-check:
    name: Desktop check
    needs: [changes, desktop-unit, desktop-suite]
    # Evaluate failed dependencies, but let superseded workflow runs cancel.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected Desktop suite
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          DESKTOP_SUITES: ${{ needs.changes.outputs.desktop_suites }}
          E2E_SUITES: ${{ needs.changes.outputs.desktop_e2e_suites }}
          UNIT_RESULT: ${{ needs.desktop-unit.result }}
          SUITES_RESULT: ${{ needs.desktop-suite.result }}
        run: |
          test "$SELECTION_RESULT" = success
          python3 - <<'PYTHON'
          import json, os
          suites = json.loads(os.environ['DESKTOP_SUITES'])
          e2e = json.loads(os.environ['E2E_SUITES'])
          flag = os.environ['DESKTOP_REQUIRED']
          if not isinstance(suites, list) or flag not in ('true', 'false') or bool(suites) != (flag == 'true'):
              raise SystemExit('Invalid Desktop selection')
          unit = [suite for suite in suites if suite.startswith('unit')]
          if unit not in ([], ['unit', 'unit-extra']) or e2e != [suite for suite in suites if not suite.startswith('unit')]:
              raise SystemExit('Desktop partition differs from complete selection')
          for name, selected in [('UNIT_RESULT', unit), ('SUITES_RESULT', e2e)]:
              wanted = 'success' if selected else 'skipped'
              if os.environ[name] != wanted:
                  raise SystemExit(f'{name}: expected {wanted}, got {os.environ[name]}')
          PYTHON

  clients-check:
    name: Clients check
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile/package-lock.json
            clients/mobile-web/package-lock.json
            packages/plugin-sdk/package-lock.json
            plugins/package-lock.json
            packages/protocol/package-lock.json

      - name: Install dependencies
        # mobile-web imports renderer sources whose dependencies live in desktop.
        run: |
          pids=()
          for workspace in \
            desktop \
            clients/core \
            clients/mobile \
            clients/mobile-web \
            packages/plugin-sdk \
            plugins \
            packages/protocol; do
            npm ci --prefix "$workspace" &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Check
        run: make check-clients check-plugins

      - name: Test and build clients with headless prerequisites
        shell: bash
        run: |
          # Keep SDK's test compilation separate from Check's typecheck compilation.
          make test-clients &
          test_pid=$!
          (
            set -e
            make build-clients
            # Same checkout, process environment and Vite configuration as build-web;
            # only --outDir differs. Use this run's fresh output, never a cache.
            test -f clients/mobile-web/dist/index.html
            rm -rf desktop/build/mobile-web
            mkdir -p desktop/build/mobile-web
            cp -R clients/mobile-web/dist/. desktop/build/mobile-web/
            npm --prefix desktop run build:core
            (cd desktop && node node_modules/vite/bin/vite.js build --config remote.vite.config.ts)
          ) &
          build_pid=$!
          (
            set -e
            for apt_source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt; do
              if [ -f "$apt_source" ]; then
                sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
              fi
            done
            # Install packages once; Playwright's --with-deps normally runs a
            # second apt update if SSH is installed in a separate later step.
            clients/mobile-web/node_modules/.bin/playwright install --with-deps chromium
            sudo apt-get install -y openssh-server
          ) &
          deps_pid=$!
          status=0
          for pid in "$test_pid" "$build_pid" "$deps_pid"; do wait "$pid" || status=1; done
          exit "$status"


      - name: Verify SSH workspace lifecycle
        timeout-minutes: 6
        shell: bash
        env:
          WUU_HEADLESS_E2E_OUTPUT: ${{ github.workspace }}/.tmp/e2e/headless-workspace
        run: |
          mkdir -p "$WUU_HEADLESS_E2E_OUTPUT"
          set -o pipefail
          npm --prefix clients/mobile-web run test:headless 2>&1 | tee "$WUU_HEADLESS_E2E_OUTPUT/run.log"

      - name: Upload SSH workspace acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-workspace-evidence
          path: .tmp/e2e/headless-workspace/
          if-no-files-found: ignore
          retention-days: 14

  macos-check:
    name: macOS native check
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checkout is GitHub's synthetic merge. Its first parent is the
          # base tree, so this compares the complete PR rather than its last commit.
          fetch-depth: 2

      - name: Select native packaging validation
        id: native-packaging
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- desktop/native desktop/package.json desktop/package-lock.json desktop/scripts desktop/electron.vite.config.ts .github/scripts/select-ci.mjs .github/workflows/ci.yml; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json

      - name: Install
        shell: bash
        run: |
          workspaces=(desktop)
          if [ "${{ steps.native-packaging.outputs.required }}" = true ]; then
            workspaces+=(clients/core clients/mobile-web plugins)
          fi
          pids=()
          for workspace in "${workspaces[@]}"; do
            npm ci --prefix "$workspace" &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          (cd desktop && node node_modules/electron/install.js && node -e 'require("electron")')

      - name: Identify Swift cache toolchain
        id: swift-toolchain
        run: echo "digest=$(xcrun swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            desktop/native/cua-mac/.build
            desktop/native/app-context-mac/.build
            desktop/native/speech-mac/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.digest }}-${{ hashFiles('desktop/native/**/Package.swift', 'desktop/native/**/Package.resolved', 'desktop/native/**/Sources/**', 'desktop/native/**/Tests/**', 'desktop/native/**/ProtocolTests/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.digest }}-

      - name: Test macOS process sandbox
        if: github.event_name != 'push'
        run: go test ./internal/processsandbox -count=1

      - name: Test macOS PTY lifecycle
        if: github.event_name != 'push'
        run: go test ./internal/process -run '^Test(PTY|ManagerTTY|StartTTY|WriteStdinToTTY)' -count=1

      - name: Test macOS release signing fixtures
        if: github.event_name != 'push'
        run: |
          npm --prefix desktop run test:release-signing
          npm --prefix desktop run test:release-packaging
          node --test desktop/scripts/build-package-prerequisites.test.cjs
          node --test desktop/scripts/test-notarization.cjs desktop/scripts/test-release-checkpoint.cjs desktop/scripts/test-update-metadata.cjs

      - name: Validate app snapshot and native helpers
        if: github.event_name != 'push'
        shell: bash
        run: |
          # These Swift packages have separate .build directories and outputs.
          # Keep every validation and join both processes before packaging begins.
          (
            set -e
            npm --prefix desktop run build:app-context-mac
            "desktop/build/app-context/Wuu App Snapshot.app/Contents/MacOS/wuu-app-context" --status
            ELECTRON_RUN_AS_NODE=1 desktop/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron -e 'if (typeof require(process.cwd() + "/desktop/build/app-context/capture-target.node").pinTarget !== "function") process.exit(1)'
          ) &
          validation_1=$!
          (
            set -e
            make test-native
          ) &
          validation_2=$!
          status=0
          wait "$validation_1" || status=1
          wait "$validation_2" || status=1
          exit "$status"

      - name: Package macOS app
        if: steps.native-packaging.outputs.required == 'true'
        # Validate the release resource layout with ad-hoc signatures on native PRs.
        run: make build-macos

      - name: Ad-hoc sign and verify packaged native resources
        if: steps.native-packaging.outputs.required == 'true'
        env:
          # PR packaging skips electron-builder's signing hook. Explicitly use
          # the existing certificate-free signer, never a CI signing identity.
          WUU_RELEASE_SIGN_ID: ""
          WUU_RELEASE_KEYCHAIN: ""
        run: |
          node - <<'NODE'
          const { readdirSync, existsSync } = require("node:fs");
          const { join } = require("node:path");
          const { execFileSync } = require("node:child_process");
          const bundles = readdirSync("desktop/release", { withFileTypes: true })
            .filter(entry => entry.isDirectory() && entry.name.startsWith("mac"))
            .map(entry => join("desktop/release", entry.name, "wuu.app"))
            .filter(path => existsSync(path));
          if (bundles.length !== 1) throw new Error(`Expected one packaged macOS app, found ${bundles.length}`);
          (async () => {
            await require("./desktop/scripts/sign-mac.cjs")({
              app: bundles[0], platform: "darwin",
              version: require("./desktop/node_modules/electron/package.json").version,
            });
            execFileSync(process.execPath, ["desktop/scripts/verify-mac-release.cjs", bundles[0]], { stdio: "inherit" });
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

  linux-check:
    name: Linux package check
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # AppImage needs user namespaces; stock Ubuntu 24.04 restricts them.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      VITE_ENABLE_ACCOUNT: "false"
      VITE_ENABLE_REMOTE_CONTROL: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json
            plugins/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux packaging dependencies
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          (sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2) &
          pids=("$!")
          for workspace in desktop plugins clients/core clients/mobile-web; do
            npm ci --prefix "$workspace" &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          node desktop/node_modules/electron/install.js
          node --test desktop/scripts/build-package-prerequisites.test.cjs desktop/scripts/linux-package-cleanup.test.cjs desktop/scripts/build-linux-ci.test.cjs
      - name: Require a working Linux filesystem sandbox
        run: |
          go test -json ./internal/processsandbox -run '^TestLinuxFilesystemBoundary$' -count=1 > "$RUNNER_TEMP/linux-sandbox.json"
          node -e 'const e=require("fs").readFileSync(require("path").join(process.env.RUNNER_TEMP,"linux-sandbox.json"),"utf8").trim().split("\n").map(JSON.parse); const cases=e.filter(x=>x.Test?.startsWith("TestLinuxFilesystemBoundary/") && x.Action==="pass"); if(e.some(x=>x.Action==="skip") || cases.length!==5) throw Error("Linux packaging requires all five Landlock boundary cases, with no skips")'
      - name: Build and verify Linux packages
        run: npm --prefix desktop run release:linux
      - name: Launch extracted packages with sandboxing
        run: xvfb-run --auto-servernum npm --prefix desktop run test:e2e:linux-package
      - name: Preserve Linux package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-evidence
          path: |
            desktop/release/linux-package-evidence/
            desktop/release/verification-linux.json
            ${{ runner.temp }}/linux-sandbox.json
          if-no-files-found: ignore
          retention-days: 14

  windows-check:
    name: Windows native check
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            clients/core/package-lock.json
            clients/mobile-web/package-lock.json

      # The full Go suite includes Unix permission, shell, and file-lifecycle
      # contracts. Keep this job focused on the Windows-native boundaries it can
      # validate rather than turning expected POSIX differences into a red gate.
      - name: Test Windows-native runtime boundaries
        if: github.event_name != 'push'
        run: |
          go test ./internal/process -run '^Test(VerifyProcessGroupRejectsMismatchedRecords|LookupProcessGroupIsPid|PTYUnsupported|TaskkillTreeIgnoresInvalidPids|ProcessExistsSelf)$'
          go test ./internal/mcp -run '^TestStdioTransportCloseTerminatesWindowsDescendants$' -count=1
          go test ./internal/session -run '^TestInferenceRuntimeProcessAliveWindows$'
          go test ./internal/tools -run '^TestProcessSandbox(PolicyMapsWorkspaceBoundary|TempRejectsSymlink|PolicyFailsClosedWithoutBackend)$'

      - name: Test Windows plugin generation leases
        if: github.event_name != 'push'
        run: go test ./internal/session -run '^Test(PluginGenerationLease|ReadPluginGenerationEpoch|PluginCatalogMutation|PluginCatalogReadLease)' -count=1 -v

      - name: Install Desktop dependencies
        run: |
          npm ci --prefix desktop
          npm ci --prefix clients/core

      - name: Typecheck Desktop on Windows
        if: github.event_name != 'push'
        run: npm --prefix desktop run typecheck

      - name: Install phone Web dependencies
        if: github.event_name != 'pull_request'
        run: npm ci --prefix clients/mobile-web

      - name: Install plugin build dependencies
        if: github.event_name != 'pull_request'
        run: npm ci --prefix plugins

      - name: Package unpacked Windows app
        if: github.event_name != 'pull_request'
        run: npm --prefix desktop run pack:win

  ci-check:
    name: CI check
    runs-on: ubuntu-latest
    needs: [changes, repository-check, go-check, desktop-check, desktop-macos-controls, clients-check, macos-check, linux-check, windows-check]
    # Evaluate failed dependencies, but let superseded workflow runs cancel.
    if: ${{ !cancelled() }}
    steps:
      - name: Require successful selection and all selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          selected = needs['changes']['outputs']
          expected = {
              'changes': True,
              'repository-check': os.environ['EVENT'] != 'push',
              'go-check': True,
              'desktop-check': True,
              'desktop-macos-controls': selected.get('desktop') == 'true' and 'shell' in json.loads(selected.get('desktop_suites', '[]')),
              'clients-check': selected.get('clients') == 'true',
              'macos-check': selected.get('native') == 'true',
              'windows-check': selected.get('native') == 'true',
              'linux-check': selected.get('native') == 'true',
          }
          for job, required in expected.items():
              result = needs[job]['result']
              wanted = 'success' if required else 'skipped'
              if result != wanted:
                  raise SystemExit(f'{job}: expected {wanted}, got {result}')
          PYTHON
