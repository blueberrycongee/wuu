              xvfb-run --auto-servernum --server-args="-screen 0 1440x1100x24" desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/composer-footer-e2e.cjs 2>&1 | tee "$WUU_FOOTER_OUTPUT/run.log" || failed=1
            done
          done
          exit "$failed"
          WUU_JOURNEY_2_3
            run_journey 'Guard workspace terminal ownership handoff' 3m 'WUU_DESKTOP_CORE=${{ runner.temp }}/wuu-session-switch-core' 'WUU_HANDOFF_COMMIT=${{ github.sha }}' 'WUU_HANDOFF_OUTPUT=${{ runner.temp }}/wuu-terminal-handoff-evidence' <<'WUU_JOURNEY_1_3'
          set -o pipefail
          mkdir -p "$WUU_HANDOFF_OUTPUT"
          failed=0
          for mode in start stop web quit; do
            WUU_HANDOFF_MODE="$mode" desktop/node_modules/.bin/electron --no-sandbox --ozone-platform=headless --ozone-override-screen-size=1600,1000 desktop/scripts/terminal-handoff-e2e.cjs 2>&1 | tee "$WUU_HANDOFF_OUTPUT/$mode.log" || failed=1
          done
          exit "$failed"
          WUU_JOURNEY_1_3
            exit "$failed"
          ) &
          worker_3=$!
          status=0
          wait "$worker_1" || status=1
          wait "$worker_2" || status=1
          wait "$worker_3" || status=1
          exit "$status"

