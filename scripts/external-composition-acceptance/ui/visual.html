<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Independent feature UI rendering acceptance</title>
  <link rel="icon" href="data:," />
  <style>
    /* Only the independent shell's layout lives here. Feature UI and controls
       retain their production styles; no clipping or font-size overrides. */
    [data-external-shell] { display:grid; grid-template-columns:260px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); height:100%; background:var(--paper); color:var(--ink); font-size:var(--font-ui); }
    [data-preview-heading] { grid-column:1 / -1; padding:var(--space-4); border-bottom:1px solid var(--hairline); }
    [data-external-navigation] { min-width:0; min-height:0; overflow:auto; padding-inline:var(--space-3); border-right:1px solid var(--hairline); background:var(--surface-1); }
    [data-preview-main] { display:flex; flex-direction:column; min-width:0; min-height:0; }
    [data-external-composer] { flex:none; min-width:0; max-height:35vh; overflow:auto; padding:var(--space-3); border-bottom:1px solid var(--hairline); }
    [data-preview-catalog] { flex:1; min-width:0; min-height:0; }
    @media (max-width:700px) {
      [data-external-shell] { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,180px) minmax(0,1fr); }
      [data-external-navigation] { border-right:0; border-bottom:1px solid var(--hairline); }
    }
  </style>
</head>
<body><div id="root"></div><script type="module" src="./visual-preview.tsx"></script></body>
</html>
